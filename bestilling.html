<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">

<title>Bestilling | Freelio</title>
<meta name="description" content="Følg betalingen fra booking til utbetaling.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Freelio">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://hweftjtulzjripkkbdeb.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">

<script src="js/design.js?v=7c71ad27"></script>
</head>
<body data-page="bestilling">
<div id="site-header"></div>
<main id="main" data-skel="page"></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=8c092c05"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=17ac34d8"></script>
<script src="js/cloud.js?v=e3bf5d40"></script>
<script src="js/media.js?v=839f9ee7"></script>
<script type="text/freelio">
if (H.requireLogin()) {
  const o = H.orderById(H.qs('id'));
  let stars = 0, text = '', confirmDispute = false, reason = '', confirmCancel = false;
  // Avtalen: frilanseren godtar før levering, kunden bekrefter godkjenningen, frilanseren kan avlyse
  let fAccOk = false, fAccTried = false, confirmApprove = false, apOk = false, apTried = false, confirmFCancel = false;
  // Originalene kan først lastes ned når kunden har godkjent. Da kan ingen laste ned og så nekte å betale.
  const LOCK_UNTIL_APPROVED = true;
  let pending = [], busy = 0, note = '', lb = -1, prog = '';
  const urls = {};
  const blobURL = async (id, kind) => { const x = (o.files || []).concat(pending).find((m) => m.id === id); return x ? Media.url(o.id, x, kind) : ''; };
  const total = (fs) => Media.size(fs.reduce((n, x) => n + x.size, 0));
  const tile = (x, i, removable) => `<div class="mtile">
      <button class="mthumb" ${removable ? '' : `data-a="open" data-v="${i}"`} aria-label="${removable ? '' : 'Åpne '}${H.esc(x.name)}"><img data-thumb="${x.id}" alt="" loading="lazy">${x.type === 'video' ? `<span class="mplay">${H.icon('play', 14, 2, 'currentColor')} ${Media.dur(x.duration)}</span>` : ''}</button>
      <div class="mmeta"><span class="mname">${H.esc(x.name)}</span><span class="meta">${Media.size(x.size)}${removable ? ` · visning ${Media.size(x.psize)}` : ''}</span></div>
      ${removable ? `<button class="ibtn" data-a="rmFile" data-v="${x.id}" aria-label="Fjern ${H.esc(x.name)}">${H.icon('close', 16, 2)}</button>` : ''}
    </div>`;
  async function hydrate() {
    for (const img of document.querySelectorAll('img[data-thumb]')) { if (!img.src) img.src = await blobURL(img.dataset.thumb, 'thumb'); }
  }
  function render() {
    const main = document.getElementById('main');
    if (!o) { main.innerHTML = `<div class="wrap section"><div class="empty">Fant ikke bestillingen. <a class="btn primary sm" href="mine-oppdrag.html">Til mine oppdrag</a></div></div>`; return; }
    const f = H.byId(o.fid); const fn = H.esc(H.first(f.name));
    // Rollen avgjør hva du ser: kunden godkjenner, frilanseren leverer. For demo-frilansere leverer kunden selv.
    const asFreelancer = o.role === 'freelancer';
    const canDeliver = asFreelancer || f.demo !== false;
    const cn = H.esc(H.first(o.customerName || 'Kunden'));
    const chatKey = asFreelancer ? 'c:' + o.customerId : f.id;
    const st = o.status; const fee = Math.round(o.price * H.FEE);
    const ctr = o.contract && typeof o.contract === 'object' ? o.contract : null;
    const acc = H.needsAccept(o);
    const disputes = +o.disputes || 0;
    // Leveransen godkjennes automatisk når kunden ikke har svart innen fristen
    const autoAt = st === 'delivered' && o.deliveredAt ? Date.parse(o.deliveredAt) + H.APPROVE_DAYS * 864e5 : 0;
    const canAuto = asFreelancer && autoAt && autoAt <= Date.now();
    const autoTxt = autoAt ? new Date(autoAt).toLocaleDateString('nb-NO', { day: 'numeric', month: 'long' }) : '';
    const reached = { paid: 1, delivered: 2, dispute: 2, approved: 4, cancelled: 1 }[st];
    const steps = [
      ['Betalt og holdt trygt', `Du betalte ${H.kr(o.price)}${o.method === 'kort' ? ' med kort' : ' med Vipps'}. Pengene holdes av betalingspartneren.`],
      ['Levert', st === 'paid' ? `${fn} laster opp leveransen her når jobben er gjort.` : `Leveranse: ${H.esc(o.delivered)}.`],
      ['Godkjent av deg', st === 'dispute' ? `${fn} har fått beskjed og har ${H.FIX_DAYS} dager på å rette opp.` : `Du har ${H.APPROVE_DAYS} dager på å se over${autoTxt ? ` (til ${autoTxt})` : ''}. Svarer du ikke, godkjennes leveransen automatisk. Bildene tilhører ${fn} til du godkjenner.`],
      ['Utbetalt', `${fn} får ${H.kr(o.price - fee)} innen 2 virkedager.`]
    ];
    const banner = asFreelancer ? {
      paid: acc ? ['warn', `${cn} har betalt ${H.kr(o.price)}. Godta oppdragsavtalen for å starte. Du kan ikke levere før du har godtatt den.`] : ['acc', `${cn} har betalt ${H.kr(o.price)}. Pengene holdes trygt. Last opp leveransen når jobben er gjort.`],
      delivered: ['acc', `Leveransen er sendt. Venter på at ${cn} godkjenner.`],
      approved: ['ok', `Godkjent. Du får ${H.kr(o.price - fee)} utbetalt innen 2 virkedager.`],
      dispute: ['bad', `${cn} har meldt fra om feil. Se meldingene og last opp en ny leveranse.`],
      cancelled: ['warn', o.cancelledBy === 'frilanser' ? 'Du har avlyst oppdraget. Kunden får hele beløpet tilbake.' : 'Kunden har avbestilt oppdraget.']
    }[st] : {
      paid: ['acc', acc ? `Pengene er trygge. Venter på at ${fn} godtar oppdragsavtalen.` : `Pengene er trygge. ${fn} får dem først når du har godkjent leveransen.`],
      delivered: ['acc', `Leveransen er klar. Se over og godkjenn, eller meld fra hvis noe ikke er som avtalt${autoTxt ? `. Svarer du ikke, godkjennes den automatisk ${autoTxt}` : ''}.`],
      approved: ['ok', o.reviewed ? 'Fullført og vurdert. Takk for at du bruker Freelio!' : `Fullført. ${fn} har fått betalt. Gi gjerne en omtale.`],
      dispute: ['bad', 'Saken er meldt. Pengene holdes til den er løst. Meldingene deres brukes som dokumentasjon.'],
      cancelled: ['warn', `${o.cancelledBy === 'frilanser' ? `${fn} har avlyst oppdraget` : 'Avbestilt'}. ${H.kr(o.refund)} blir refundert til deg innen 5 virkedager.`]
    }[st];
    main.innerHTML = `<div class="wrap" style="max-width:1300px">
      <div class="crumbs"><a href="mine-oppdrag.html">Mine oppdrag</a><span>/</span><span>${H.esc(o.title)}</span></div>
      <div class="two">
        <div class="stack" style="gap:20px">
          <div class="row">${H.avatar(asFreelancer ? H.partner(chatKey) : f, 56)}<div class="stack grow" style="gap:2px"><h1 style="font-size:28px">${H.esc(o.title)}</h1><span class="muted">${asFreelancer ? 'Kunde: ' + H.esc(o.customerName || 'Kunde') : H.esc(f.name)} · ${H.esc(o.date)}${o.place ? ' · ' + H.esc(o.place) : ''}</span></div></div>
          <div class="banner ${banner[0]}">${H.icon('shield', 20)}<span>${banner[1]}</span></div>
          <ol class="steps">${steps.map((s, i) => { const n = i + 1; const cls = st === 'dispute' && n === 3 ? 'warn' : n <= reached ? 'done' : n === reached + 1 ? 'cur' : ''; return `<li class="${cls}"><div class="rail"><span class="n">${cls === 'done' ? H.icon('check', 14, 3) : n}</span>${n < 4 ? '<span class="ln"></span>' : ''}</div><div class="t"><b>${s[0]}</b><span class="muted small">${s[1]}</span></div></li>`; }).join('')}</ol>
          ${asFreelancer && acc && ctr ? `<section class="card stack ctr-box" style="gap:12px"><b style="font-size:16px">${H.icon('clipboard', 18)} Godta avtalen for å starte</b>
            <p class="hint" style="margin:0">${cn} har booket og betalt ${H.kr(o.price)}. Du eier bildene frem til kunden godkjenner leveransen. Pengene utbetales når kunden godkjenner, eller automatisk ${H.APPROVE_DAYS} dager etter levering.</p>
            ${ctr.cTerms ? `<div class="banner warn" style="margin:0">${H.icon('pen', 18)}<span>${cn} har lagt til egne vilkår i punkt 8. Les dem før du godtar.</span></div>` : ''}
            <details class="ctr-more" ${ctr.cTerms ? 'open' : ''}><summary>Les hele avtalen</summary><div class="ctr">${H.contractHTML(ctr)}</div></details>
            <label class="check"><input type="checkbox" id="fAccOk" ${fAccOk ? 'checked' : ''}> <span>Jeg har lest og godtar oppdragsavtalen${ctr.cTerms ? ', også kundens tillegg' : ''}.</span></label>
            ${fAccTried && !fAccOk ? '<span class="err-text">Kryss av for at du godtar avtalen.</span>' : ''}
            <div class="row"><button class="btn primary" data-a="acceptContract">Godta avtalen</button></div>
          </section>` : ''}
          ${(st === 'paid' || (st === 'dispute' && asFreelancer)) && canDeliver && !(asFreelancer && acc) ? `<section class="card stack" style="gap:16px"><div class="row" style="justify-content:space-between"><b style="font-size:16px">Lever jobben</b>${asFreelancer ? '' : '<span class="pill">Frilanserens visning (demo)</span>'}</div>
            <label class="drop" id="drop"><input type="file" id="files" accept="image/*,video/*" multiple class="sr">${H.icon('plus', 22, 2)}<b>Last opp bilder eller video</b><span class="meta">Dra filene hit, eller klikk for å velge. Originalene lagres i full kvalitet. Kunden ser en komprimert forhåndsvisning med vannmerke til leveransen er godkjent. Video tar litt lenger tid, fordi vannmerket legges på hele videoen.</span></label>
            ${busy ? `<div class="row small muted"><span class="spin"></span><span id="upProg">${prog ? H.esc(prog) : `Behandler ${busy} ${busy === 1 ? 'fil' : 'filer'} …`}</span></div>` : ''}
            ${pending.length ? `<div class="mlist">${pending.map((x, i) => tile(x, i, true)).join('')}</div><span class="meta">${pending.length} ${pending.length === 1 ? 'fil' : 'filer'} · originaler ${total(pending)} · forhåndsvisninger ${Media.size(pending.reduce((n, x) => n + x.psize, 0))}</span>` : ''}
            <label class="field"><span class="label">Melding til kunden</span><textarea class="inp" id="dnote" rows="2" maxlength="1000" placeholder="F.eks. Her er de redigerte bildene. Si fra hvis du vil ha noe justert.">${H.esc(note)}</textarea></label>
            <div class="row"><button class="btn primary" data-a="sendDelivery" ${pending.length && !busy ? '' : 'disabled'}>Send leveranse</button>${asFreelancer ? '' : `<button class="btn link" data-a="sampleFiles" ${busy ? 'disabled' : ''}>Bruk eksempelbilder</button>`}</div>
          </section>` : ''}
          ${['delivered', 'approved', 'dispute'].includes(st) ? (o.files && o.files.length ? `<section class="card stack" style="gap:16px">
            <div class="row" style="justify-content:space-between"><div class="stack" style="gap:0"><b style="font-size:16px">Leveranse</b><span class="meta">${o.files.length} ${o.files.length === 1 ? 'fil' : 'filer'} · ${total(o.files)} i full kvalitet</span></div>
              ${locked() ? `<span class="pill">${H.icon('lock', 12, 2)} Låses opp når du godkjenner</span>` : `<button class="btn soft sm" data-a="dlAll">${H.icon('download', 16, 2)} Last ned alle</button>`}</div>
            ${o.deliveryNote ? `<div class="bubble them" style="max-width:100%">${H.esc(o.deliveryNote)}</div>` : ''}
            <div class="mgrid">${o.files.map((x, i) => tile(x, i, false)).join('')}</div>
            <span class="meta">Visningen her er komprimert så siden laster raskt. ${locked() ? 'Originalene kan lastes ned etter godkjenning.' : 'Last ned for å få originalene i full kvalitet.'}</span></section>`
            : `<div class="card stack"><b>Leveranse</b><div class="gallery" style="grid-template-columns:repeat(4,minmax(0,1fr))">${[0, 1, 2, 3].map((i) => `<span class="ph" style="${H.phStyle(f.pal + i)}"></span>`).join('')}</div><span class="muted small">${H.esc(o.delivered)}</span></div>`) : ''}
          ${st === 'delivered' && confirmDispute ? `<div class="card stack"><b>Hva er ikke som avtalt?</b><textarea class="inp" id="reason" rows="3" maxlength="1000" placeholder="Beskriv kort hva som mangler eller er feil">${H.esc(reason)}</textarea><div class="row"><button class="btn soft sm" data-a="cancelDispute">Avbryt</button><button class="btn dark sm" data-a="dispute">Send til ${fn}</button></div></div>` : ''}
          ${st === 'approved' && !o.reviewed && !asFreelancer ? `<div class="card stack"><h2 style="font-size:20px">Hvordan var ${fn}?</h2>
            <div class="stars" role="radiogroup" aria-label="Antall stjerner">${[1, 2, 3, 4, 5].map((k) => `<button role="radio" aria-checked="${k === stars}" aria-label="${k} stjerner" class="${k <= stars ? 'on' : ''}" data-a="stars" data-v="${k}">${H.star(24)}</button>`).join('')}</div>
            <label class="field"><span class="label">Fortell andre om oppdraget</span><textarea class="inp" id="rtext" rows="4" maxlength="1500" placeholder="Hva var bra? Var noe annerledes enn avtalt?">${H.esc(text)}</textarea></label>
            <p class="hint">Omtalen publiseres når ${fn} også har vurdert deg, eller etter 14 dager. Da kan ingen av dere svare på den andres omtale først.</p>
            <button class="btn primary" data-a="review" ${stars ? '' : 'disabled'}>Send omtale</button></div>` : ''}
        </div>
        <aside>
          <div class="card stack">
            <div class="sum"><div><span>Oppdrag</span><b>${H.kr(o.price)}</b></div><div class="muted"><span>Plattformavgift 5 %</span><span>− ${H.kr(fee)}</span></div><div class="tot"><span>${fn} får</span><span>${H.kr(o.price - fee)}</span></div></div>
            ${st === 'delivered' && !confirmDispute && !asFreelancer && !confirmApprove ? `<button class="btn primary block" data-a="askApprove">Godkjenn og betal ut</button>${disputes < H.MAX_DISPUTES ? '<button class="btn ghost block" data-a="askDispute">Meld fra om feil</button>' : `<p class="hint">Du har meldt fra om feil ${H.MAX_DISPUTES} ganger. Er du fortsatt ikke fornøyd, <a href="hjelp.html">kontakt Freelio</a>, så avgjør vi saken.</p>`}` : ''}
            ${st === 'delivered' && confirmApprove && !asFreelancer ? `<div class="stack small"><label class="check"><input type="checkbox" id="apOk" ${apOk ? 'checked' : ''}> <span>Jeg har sett over leveransen og godkjenner den. ${fn} får betalt, og rettighetene til filene blir mine.</span></label>${apTried && !apOk ? '<span class="err-text">Kryss av for å godkjenne.</span>' : ''}<div class="row"><button class="btn soft sm grow" data-a="noApprove">Avbryt</button><button class="btn primary sm grow" data-a="approve">Godkjenn</button></div></div>` : ''}
            ${st === 'delivered' && asFreelancer ? (canAuto ? `<button class="btn primary block" data-a="autoApprove">Be om utbetaling</button><p class="hint">${cn} har ikke svart på ${H.APPROVE_DAYS} dager, så leveransen regnes som godkjent.</p>` : autoTxt ? `<p class="hint">${cn} har frist til ${autoTxt} på å svare. Etter det kan du be om utbetaling.</p>` : '') : ''}
            ${st === 'paid' && asFreelancer && !confirmFCancel ? '<button class="btn ghost block" data-a="askFCancel">Avlys oppdraget</button>' : ''}
            ${st === 'paid' && asFreelancer && confirmFCancel ? `<div class="stack small"><span>Avlyser du, får ${cn} hele beløpet tilbake. Vil du avlyse?</span><div class="row"><button class="btn soft sm grow" data-a="noFCancel">Nei</button><button class="btn dark sm grow" data-a="fCancel">Ja, avlys</button></div></div>` : ''}
            ${st === 'paid' && !confirmCancel && !asFreelancer ? `<button class="btn ghost block" data-a="askCancel">Avbestill</button>` : ''}
            ${st === 'paid' && confirmCancel ? `<div class="stack small"><span>${o.refundAll ? 'Du får hele beløpet tilbake.' : 'Avbestilling nærmere enn 7 dager før gir 50 % tilbake.'} Vil du avbestille?</span><div class="row"><button class="btn soft sm grow" data-a="noCancel">Nei</button><button class="btn dark sm grow" data-a="cancel">Ja, avbestill</button></div></div>` : ''}
            ${st === 'dispute' && !asFreelancer && f.demo !== false ? `<button class="btn soft block" style="border:1.5px dashed var(--muted)" data-a="resolve">Demo: ${fn} retter opp</button>` : ''}
            ${ctr ? `<div class="ctr-status"><b>${H.icon('clipboard', 16)} Oppdragsavtale</b><span>${H.icon('check', 14, 3)} ${asFreelancer ? cn : 'Du'} godtok ${H.esc(H.when(ctr.customerAt))}</span><span>${ctr.freelancerAt ? `${H.icon('check', 14, 3)} ${asFreelancer ? 'Du' : fn} godtok ${H.esc(H.when(ctr.freelancerAt))}` : `${H.icon('clock', 14, 2)} Venter på at ${asFreelancer ? 'du' : fn} godtar`}</span><a href="avtale.html?id=${encodeURIComponent(o.id)}">Se hele avtalen</a></div>` : ''}
            <a class="btn soft block" href="meldinger.html?med=${encodeURIComponent(chatKey)}">${H.icon('chat', 18)} Send melding til ${asFreelancer ? cn : fn}</a>
            ${asFreelancer ? '' : `<a class="btn link" href="frilanser.html?id=${f.id}">Se profilen til ${fn}</a>`}
            ${st === 'paid' && !asFreelancer && !canDeliver ? `<p class="hint">${fn} laster opp leveransen her. Du får beskjed når den er klar.</p>` : ''}
          </div>
          ${st === 'paid' ? `<p class="hint">Avbestilling: gratis frem til 7 dager før. Etter det får du 50 % tilbake. <a href="hjelp.html">Les mer</a></p>` : ''}
        </aside>
      </div></div>`;
    const rt = document.getElementById('rtext'); if (rt) rt.addEventListener('input', (e) => (text = e.target.value));
    const fa = document.getElementById('fAccOk'); if (fa) fa.addEventListener('change', () => (fAccOk = fa.checked));
    const ap = document.getElementById('apOk'); if (ap) ap.addEventListener('change', () => (apOk = ap.checked));
    const rs = document.getElementById('reason'); if (rs) rs.addEventListener('input', (e) => (reason = e.target.value));
    const dn = document.getElementById('dnote'); if (dn) dn.addEventListener('input', (e) => (note = e.target.value));
    const inp = document.getElementById('files'); if (inp) inp.addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
    const drop = document.getElementById('drop');
    if (drop) {
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
    }
    hydrate();
    renderLightbox();
  }
  const locked = () => LOCK_UNTIL_APPROVED && o.status !== 'approved' && o.role !== 'freelancer';
  async function addFiles(list) {
    const files = [...list];
    if (!Media.supported) { H.toast('Nettleseren støtter ikke lagring av filer'); return; }
    busy += files.length; render();
    for (const file of files) {
      try { pending.push(await Media.add(o.id, file, (t) => { prog = file.name + ': ' + t; const el = document.getElementById('upProg'); if (el) el.textContent = prog; })); }
      catch (e) { H.toast(file.name + ': ' + e.message); }
      busy--; prog = ''; render();
    }
  }
  function renderLightbox() {
    let el = document.getElementById('lb');
    if (lb < 0 || !o.files || !o.files[lb]) { if (el) el.remove(); document.body.style.overflow = ''; return; }
    const x = o.files[lb];
    if (!el) { el = document.createElement('div'); el.id = 'lb'; el.className = 'lb'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); document.body.appendChild(el); }
    document.body.style.overflow = 'hidden';
    el.setAttribute('aria-label', x.name);
    el.innerHTML = `<div class="lb-top"><div class="stack" style="gap:0;min-width:0"><b class="mname">${H.esc(x.name)}</b><span class="small" style="opacity:.7">${lb + 1} av ${o.files.length} · original ${Media.size(x.size)}${x.w ? ` · ${+x.w || 0}×${+x.h || 0}` : ''}</span></div>
        <div class="row" style="flex-wrap:nowrap">${locked() ? `<span class="small" style="opacity:.7">${H.icon('lock', 14, 2)} Godkjenn for å laste ned</span>` : `<button class="btn sm lb-dl" data-a="dl" data-v="${lb}">${H.icon('download', 16, 2)} Last ned original</button>`}<button class="ibtn lb-x" data-a="closeLb" aria-label="Lukk">${H.icon('close', 20, 2)}</button></div></div>
      <div class="lb-stage">${x.type === 'video' ? `<video controls playsinline preload="metadata" id="lbmedia"></video>` : `<img id="lbmedia" alt="${H.esc(x.name)}">`}${locked() && x.type === 'video' && !x.wm ? `<div class="lb-wmov" style="background-image:url(${Media.wmTile()})" aria-hidden="true"></div>` : ''}</div>
      ${o.files.length > 1 ? `<button class="ibtn lb-nav prev" data-a="nav" data-v="-1" aria-label="Forrige">${H.icon('back', 22, 2)}</button><button class="ibtn lb-nav next" data-a="nav" data-v="1" aria-label="Neste">${H.icon('next', 22, 2)}</button>` : ''}`;
    el.querySelector('.lb-stage').addEventListener('click', (e) => { if (e.target === e.currentTarget) { lb = -1; renderLightbox(); } });
    const media = el.querySelector('#lbmedia');
    (async () => {
      // Video: kunden ser versjonen med vannmerke til leveransen er godkjent. Etter det spilles originalen, hvis den er én fil
      // og nettleseren kan spille den. Eldre videoer uten innbrent vannmerke får mønsteret oppå (lb-wmov).
      if (x.type === 'video') {
        media.poster = await blobURL(x.id, 'preview');
        const full = x.wm && !locked() && !x.parts;
        if (full) media.addEventListener('error', async () => { media.src = await blobURL(x.id, 'stream'); }, { once: true });
        media.src = await blobURL(x.id, full ? 'original' : x.wm ? 'stream' : 'original');
      }
      // Forhåndsvisningen har vannmerke. Når originalen er låst opp, vises den i stedet, hvis nettleseren kan vise den.
      else media.src = await blobURL(x.id, !locked() && !x.parts && /^image\/(jpeg|png|webp|gif)$/.test(x.mime || '') ? 'original' : 'preview');
    })();
    el.querySelector('.lb-x').focus();
  }
  document.addEventListener('keydown', (e) => {
    if (lb < 0) return;
    if (e.key === 'Escape') { lb = -1; renderLightbox(); }
    if (e.key === 'ArrowRight') H.actions.nav(1);
    if (e.key === 'ArrowLeft') H.actions.nav(-1);
  });
  async function dl(i) {
    const x = o.files[i];
    if (x.parts) H.toast('Laster ned ' + x.name + ' … Stor fil, dette kan ta litt tid.');
    const ok = await Media.save(o.id, x);
    if (!ok) H.toast('Fant ikke filen. Prøv å laste inn siden på nytt.');
  }
  const f0 = () => H.byId(o.fid);
  const upd = (msg) => { H.save(); H.mountHeader(); render(); if (msg) H.toast(msg); };
  Object.assign(H.actions, {
    sampleFiles: async () => { busy += 4; render(); const out = await Media.sample(o.id, 4, (i) => H.pal(f0().pal + i)); pending.push(...out); busy -= 4; render(); },
    rmFile: (v) => { const x = pending.find((m) => m.id === v); pending = pending.filter((m) => m.id !== v); if (x) Media.discard(o.id, x); render(); },
    sendDelivery: () => {
      if (!pending.length) return;
      o.files = (o.files || []).concat(pending); o.deliveryNote = note.trim(); pending = []; note = '';
      o.status = 'delivered'; o.deliveredAt = new Date().toISOString(); o.delivered = `${o.files.length} ${o.files.length === 1 ? 'fil' : 'filer'}, ${total(o.files)}`;
      const msg = 'Leveransen er lastet opp. ' + (o.deliveryNote || 'Si fra hvis du vil ha noe justert.');
      if (o.role === 'freelancer') (H.S.threads['c:' + o.customerId] = H.S.threads['c:' + o.customerId] || []).push({ who: 'me', text: msg, at: Date.now() });
      else (H.S.threads[o.fid] = H.S.threads[o.fid] || []).push({ who: 'them', text: msg, at: Date.now() });
      upd('Leveransen er sendt til kunden.');
    },
    open: (v) => { lb = +v; renderLightbox(); },
    closeLb: () => { lb = -1; renderLightbox(); },
    nav: (v) => { if (lb < 0) return; lb = (lb + +v + o.files.length) % o.files.length; renderLightbox(); },
    dl: (v) => { if (locked()) return; dl(+v); },
    dlAll: async () => { if (locked()) return; H.toast(`Laster ned ${o.files.length} filer`); for (let i = 0; i < o.files.length; i++) { await dl(i); await new Promise((r) => setTimeout(r, 350)); } },
    askApprove: () => { confirmApprove = true; apOk = false; apTried = false; render(); },
    noApprove: () => { confirmApprove = false; render(); },
    approve: () => { if (!apOk) { apTried = true; render(); return; } o.status = 'approved'; o.approvedBy = 'kunde'; confirmApprove = false; upd('Godkjent. Pengene er på vei til frilanseren, og filene er dine.'); },
    // Frilanseren: kunden har ikke svart innen fristen
    autoApprove: () => { o.status = 'approved'; o.approvedBy = 'automatisk'; upd('Leveransen er godkjent automatisk. Pengene er på vei.'); },
    acceptContract: () => { if (!fAccOk) { fAccTried = true; render(); return; } o.contract = Object.assign({}, o.contract, { freelancerAt: new Date().toISOString() }); upd('Avtalen er godtatt. Nå kan du levere jobben.'); },
    askFCancel: () => { confirmFCancel = true; render(); },
    noFCancel: () => { confirmFCancel = false; render(); },
    fCancel: () => { o.status = 'cancelled'; o.refund = o.price; o.cancelledBy = 'frilanser'; confirmFCancel = false; upd('Oppdraget er avlyst. Kunden får hele beløpet tilbake.'); },
    askCancel: () => { const d = String(o.date).split('.'); const when = d.length === 3 ? new Date(+d[2], +d[1] - 1, +d[0]) : null; o.refundAll = !when || when - Date.now() > 7 * 864e5; confirmCancel = true; render(); },
    noCancel: () => { confirmCancel = false; render(); },
    cancel: () => { o.status = 'cancelled'; o.refund = o.refundAll ? o.price : Math.round(o.price / 2); o.cancelledBy = 'kunde'; confirmCancel = false; upd('Bestillingen er avbestilt.'); },
    askDispute: () => { confirmDispute = true; render(); },
    cancelDispute: () => { confirmDispute = false; render(); },
    dispute: () => { if (!reason.trim()) { H.toast('Skriv kort hva som er feil.'); return; } o.status = 'dispute'; o.disputes = (+o.disputes || 0) + 1; confirmDispute = false; (H.S.threads[o.fid] = H.S.threads[o.fid] || []).push({ who: 'sys', text: 'Kunden har meldt fra om feil: ' + reason.trim(), at: Date.now() }); upd('Sendt. Pengene holdes til saken er løst.'); },
    resolve: () => { o.status = 'delivered'; o.delivered += ' (rettet opp)'; upd('Frilanseren har levert på nytt.'); },
    stars: (v) => { stars = +v; render(); },
    review: () => {
      (H.S.extraReviews[o.fid] = H.S.extraReviews[o.fid] || []).unshift([H.S.user.name, stars, o.title + ' · ' + H.today(), text.trim() || 'Ingen kommentar.', true, o.id]);
      o.reviewed = true; upd('Takk! Omtalen er lagt til på profilen.');
    }
  });
  H.boot(render);
}
</script>
</body>
</html>
