<script type="text/freelio">
const next = H.qs('neste');
const safeNext = next && /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next) ? next : null;
function intro() {
  document.getElementById('main').innerHTML = `<section class="hero"><div class="wrap hero-in"><div class="stack" style="gap:18px"><h1>Få oppdrag <em>i nærheten</em>, og få betalt uten å purre.</h1><p>Vis frem arbeidet ditt, motta forespørsler og send tilbud på oppdrag. Pengene er sikret før du starter.</p><div class="row"><a class="btn primary" href="logg-inn.html?neste=bli-frilanser.html">Kom i gang gratis</a><a class="btn ghost" href="slik-fungerer-det.html#priser">Se priser</a></div></div><div class="mosaic" aria-hidden="true">${[3, 7, 9, 0, 5, 11].map((i) => `<span class="ph" style="${H.phStyle(i)}"></span>`).join('')}</div></div></section>
  <div class="wrap section"><div class="steps3">
    <div class="card"><span class="n">1</span><h3>Lag profil</h3><p class="muted">Logg inn med BankID, legg inn arbeid, pakker og område.</p></div>
    <div class="card"><span class="n">2</span><h3>Få forespørsler</h3><p class="muted">Kunder booker deg direkte, eller du sender tilbud på oppdrag.</p></div>
    <div class="card"><span class="n">3</span><h3>Lever og få betalt</h3><p class="muted">Pengene er betalt inn før du starter. Utbetaling innen 2 virkedager etter godkjenning.</p></div></div></div>`;
}
let pkgs, pf, cover, card, niches, upCat; const draft = {};
const RESP = [[1, '1 time'], [3, '3 timer'], [6, '6 timer'], [24, '1 dag'], [48, '2 dager']];
const DEL = [[0, 'Samme dag'], [1, '1 dag'], [2, '2 dager'], [3, '3 dager'], [5, '5 dager'], [7, '7 dager'], [14, '14 dager'], [21, '21 dager'], [30, '30 dager']];
const CLOUD = !!(window.Cloud && Cloud.on);
const PF_MAX = CLOUD ? 24 : 8;
const VID_MB = H.VID_MB();
let pfBusy = '', coverBusy = '', cardBusy = '', saving = false;
// Henting fra en portefølje på nett (Supabase-funksjonen hent-portefolje, se supabase/functions)
let imp = { busy: '', err: '', found: null, sel: [] };
const impReset = () => { imp = { busy: '', err: '', found: null, sel: [] }; };
const fnError = async (err) => {
  const res = err && err.context;
  if (res && typeof res.json === 'function') {
    if (res.status === 404) return 'Henting fra portefølje er ikke slått på ennå.';
    if (res.status === 401) return 'Logg inn på nytt og prøv igjen.';
    try { const j = await res.json(); if (j && j.error) return j.error; } catch (e) { /* ikke JSON */ }
  }
  return 'Fikk ikke kontakt. Prøv igjen.';
};
function impCard() {
  const f = imp.found, room = PF_MAX - pf.length;
  return `<section class="card stack" style="gap:10px"><b style="font-size:15px">Hent fra porteføljen din</b>
    <span class="hint">Har du en nettside med arbeidet ditt? Lim inn lenken, så henter vi beskrivelsen og bildene. Du velger selv hva som skal med.</span>
    <div class="row" style="flex-wrap:nowrap"><label class="sr" for="impUrl">Lenke til porteføljen</label><input class="inp grow" id="impUrl" type="url" inputmode="url" maxlength="500" placeholder="https://din-portefolje.no" autocomplete="url" value="${H.esc(draft.impUrl || '')}"><button type="button" class="btn soft" data-a="impFetch" ${imp.busy ? 'disabled' : ''}>${imp.busy && !f ? H.esc(imp.busy) : 'Hent'}</button></div>
    ${imp.err ? `<span class="err-text" role="alert">${H.esc(imp.err)}</span>` : ''}
    ${f ? `<div class="stack" style="gap:8px">
      <span class="small">Fant <b>${H.esc(f.title || f.host)}</b>.${f.usedBio ? ' Beskrivelsen er lagt inn under «Om deg». Rett den gjerne.' : ''}</span>
      ${f.images.length ? `<span class="hint">Trykk på bildene du vil ha med. Du har plass til ${room} til i porteføljen.</span>
        <div class="imp-grid">${f.images.map((src, i) => `<button type="button" class="imp-pick" data-a="impPick" data-v="${i}" aria-pressed="${imp.sel.includes(i)}" aria-label="Velg bilde ${i + 1}"><img src="${H.esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="imp-check">${H.icon('check', 14, 3)}</span></button>`).join('')}</div>
        <div class="row"><button type="button" class="btn primary sm" data-a="impAdd" ${imp.sel.length && !imp.busy ? '' : 'disabled'}>${imp.busy ? H.esc(imp.busy) : imp.sel.length ? `Legg til ${imp.sel.length} ${imp.sel.length === 1 ? 'bilde' : 'bilder'}` : 'Velg bilder'}</button><button type="button" class="btn link small" data-a="impClose">Lukk</button></div>`
      : '<span class="hint">Fant ingen bilder på siden. Last dem opp under Portefølje i stedet.</span>'}</div>` : ''}
  </section>`;
}
// Velg nytt bakgrunnsbilde (file) eller juster det du har (uten file). Originalen lagres så du kan justere senere.
async function editCover(file) {
  const old = cover;
  let src = old && old.src, input = file;
  try {
    if (!file) { if (!src) return; input = await (await fetch(src)).blob(); }
    const blob = await H.cropImage(input, { aspect: 3, outW: CLOUD ? 1800 : 1200, state: file ? null : old.crop, title: 'Juster bakgrunnsbildet', hint: 'Dra bildet for å flytte det, og zoom for å velge utsnittet. Det vises bredt øverst på profilen din.' });
    if (!blob) return;
    coverBusy = 'Laster opp …'; form();
    if (file) src = await H.storeImage('cover-src', (await H.resizeImage(file, CLOUD ? 2400 : 1400)).blob);
    const b = await H.resizeImage(blob, 700);
    cover = { url: await H.storeImage('cover', blob), thumb: await H.storeImage('thumb', b.blob), src, crop: blob.cropState || null };
    if (old) { H.dropImage(old.url); H.dropImage(old.thumb); if (old.src && old.src !== src) H.dropImage(old.src); }
  } catch (e) { H.toast(e.message || 'Bildet kunne ikke lastes opp'); }
  coverBusy = ''; form();
}
function form() {
  const S = H.S; const p = Object.assign({}, S.profile || {}, draft);
  H.fixCats(p);
  pkgs = pkgs || (p.pk ? p.pk.map((x) => x.slice()) : [['', '', '']]);
  pf = pf || (p.portfolio || []).slice();
  if (cover === undefined) cover = p.coverImg || null;
  if (card === undefined) card = p.cardImg || null;
  // Fagfelt: hovedområdet er alltid med. Hvert bilde i porteføljen hører til ett av dem.
  const mainCat = p.cat || HDATA.CATS[0].id;
  niches = niches || ((p.niches && p.niches.length) ? p.niches.slice() : [mainCat]);
  if (!niches.includes(mainCat)) niches.unshift(mainCat);
  if (!upCat || !niches.includes(upCat)) upCat = mainCat;
  pf.forEach((x) => { if (!x.cat || !niches.includes(x.cat)) x.cat = mainCat; });
  const catOpts = (sel) => HDATA.CATS.map((c) => `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
  document.getElementById('main').innerHTML = `<div class="wrap" style="max-width:1300px"><div class="two">
    <form class="stack" style="gap:20px" id="pform" novalidate>
      <div class="stack" style="gap:6px"><h1>${S.profile ? 'Rediger frilanserprofil' : 'Lag frilanserprofil'}</h1><p class="muted">Profilen vises i søk, på kart og i feeden når du publiserer.</p></div>
      ${CLOUD ? impCard() : ''}
      <section class="card">${H.photoPicker(S.user)}</section>
      <section class="card stack" style="gap:10px"><b style="font-size:15px">Bakgrunnsbilde</b>
        <div class="cover-pick">${cover ? `<img src="${H.esc(cover.url)}" alt="Bakgrunnsbildet ditt">` : `<span class="hint">Ingen valgt. Det første bildet i porteføljen brukes.</span>`}</div>
        <div class="row"><label class="btn soft sm" for="coverFile">${H.icon('plus', 16, 2.2)} ${cover ? 'Bytt bakgrunnsbilde' : 'Velg bakgrunnsbilde'}</label><input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp" class="sr">${cover && cover.src ? '<button type="button" class="btn soft sm" data-a="editCover">Juster bildet</button>' : ''}${cover ? '<button type="button" class="btn link small" data-a="rmCover">Fjern</button>' : ''}<span class="hint" id="coverStatus">${H.esc(coverBusy)}</span></div>
        <span class="hint">Vises øverst på profilen din. Bruk et bredt bilde, gjerne 1600 piksler eller mer.</span></section>
      <section class="card stack" style="gap:10px"><b style="font-size:15px">Bilde på kortet</b>
        <div class="card-pick">${card ? `<img src="${H.esc(card.url)}" alt="Bildet på kortet ditt">` : `<span class="hint" style="padding:12px">Ingen valgt. ${cover ? 'Bakgrunnsbildet' : 'Det første bildet i porteføljen'} brukes.</span>`}</div>
        <div class="row"><label class="btn soft sm" for="cardFile">${H.icon('plus', 16, 2.2)} ${card ? 'Bytt bilde på kortet' : 'Velg bilde på kortet'}</label><input type="file" id="cardFile" accept="image/jpeg,image/png,image/webp" class="sr">${card ? '<button type="button" class="btn link small" data-a="rmCard">Fjern</button>' : ''}<span class="hint" id="cardStatus">${H.esc(cardBusy)}</span></div>
        <span class="hint">Vises på kortet ditt i søket og på forsiden. Velg gjerne et annet bilde enn bakgrunnsbildet, så hvert bilde passer sitt format.</span></section>
      <div class="grid2"><label class="field"><span class="label">Navn *</span><input class="inp" id="name" maxlength="60" value="${H.esc(p.name || S.user.name)}"></label>
      <label class="field"><span class="label">Hovedområde *</span><select class="inp" id="cat">${HDATA.CATS.map((c) => `<option value="${c.id}" ${p.cat === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></label></div>
      <label class="field"><span class="label">Tittel *</span><input class="inp" id="role" maxlength="60" value="${H.esc(p.role || '')}" placeholder="F.eks. Bryllupsfotograf, Videograf, Dronepilot"></label>
      <div class="grid2"><label class="field"><span class="label">Område *</span><input class="inp" id="area" maxlength="60" value="${H.esc(p.area || '')}" placeholder="F.eks. Sandvika"></label>
      <label class="field"><span class="label">Hvor langt reiser du?</span><select class="inp" id="reach">${[5, 10, 25, 50].map((k) => `<option value="${k}" ${p.reach == k ? 'selected' : ''}>Inntil ${k} km</option>`).join('')}</select></label></div>
      <div class="grid2"><label class="field"><span class="label">Års erfaring *</span><input class="inp" id="years" type="number" min="0" max="60" inputmode="numeric" value="${H.esc(p.years != null ? p.years : '')}" placeholder="F.eks. 3"></label>
      <label class="field"><span class="label">Hvor raskt svarer du?</span><select class="inp" id="respH">${RESP.map(([h, t]) => `<option value="${h}" ${(p.respH || 1) == h ? 'selected' : ''}>Innen ${t}</option>`).join('')}</select></label></div>
      <div class="grid2"><label class="field"><span class="label">Vanlig leveringstid</span><select class="inp" id="delD">${DEL.map(([d, t]) => `<option value="${d}" ${(p.delD != null ? p.delD : 7) == d ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="field"><span class="label">Hvor ledig er du?</span><select class="inp" id="free"><option value="1" ${p.free === false || p.free === '0' ? '' : 'selected'}>Ledig kapasitet</option><option value="0" ${p.free === false || p.free === '0' ? 'selected' : ''}>Få ledige datoer</option></select></label></div>
      <label class="field"><span class="label">Om deg *</span><textarea class="inp" id="bio" rows="4" maxlength="1500" placeholder="Hva er du god på, og hva kan kunden forvente?">${H.esc(p.bio || '')}</textarea></label>
      <fieldset style="border:0;padding:0;margin:0" class="field"><legend class="label" style="margin-bottom:6px">Fagfelt du tilbyr *</legend>
        <div class="niche-grid">${HDATA.CATS.map((c) => `<label class="check"><input type="checkbox" data-niche="${c.id}" ${niches.includes(c.id) ? 'checked' : ''} ${c.id === mainCat ? 'disabled' : ''}> ${c.name}</label>`).join('')}</div>
        <span class="hint">Kryss av alt du tar oppdrag innen. Hovedområdet er alltid med. Du vises i søket for hvert fagfelt du krysser av.</span></fieldset>
      <fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="label" style="margin-bottom:8px">Pakker og priser * <span class="hint" style="font-weight:600">(minst én)</span></legend>
        ${pkgs.map((x, i) => `<div class="card stack" style="gap:8px"><div class="grid2"><input class="inp" data-pk="${i}:0" maxlength="40" value="${H.esc(x[0])}" placeholder="Navn, f.eks. Halv dag" aria-label="Pakkenavn ${i + 1}"><input class="inp" data-pk="${i}:1" maxlength="7" value="${H.esc(x[1])}" inputmode="numeric" placeholder="Pris i kr" aria-label="Pris ${i + 1}"></div><input class="inp" data-pk="${i}:2" maxlength="200" value="${H.esc(x[2])}" placeholder="Hva er inkludert?" aria-label="Beskrivelse ${i + 1}">${pkgs.length > 1 ? `<button type="button" class="btn link small" style="align-self:flex-start" data-a="rmPk" data-v="${i}">Fjern pakke</button>` : ''}</div>`).join('')}
        ${pkgs.length < 4 ? '<button type="button" class="btn soft sm" style="align-self:flex-start" data-a="addPk">Legg til pakke</button>' : ''}</fieldset>
      <label class="field"><span class="label">Egne vilkår (valgfritt)</span><textarea class="inp" id="terms" rows="4" maxlength="3000" placeholder="F.eks. reisekostnader over 50 km, hvor mange runder med retting som er med, eller hvordan kunden kan bruke bildene.">${H.esc(p.terms || '')}</textarea><span class="hint">Vises på profilen din og legges inn i oppdragsavtalen ved hver booking (punkt 8). <a href="avtale.html" target="_blank">Freelios standardavtale</a> gjelder i tillegg, og går foran for betaling, avbestilling og reklamasjon.</span></label>
      <fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="label" style="margin-bottom:4px">Portefølje</legend>
        <p class="hint">Last opp dine beste bilder og videoer, gjerne 6 til ${PF_MAX}. Store videoer gjøres automatisk mindre, til under ${VID_MB} MB. Velg fagfelt under hvert bilde. Søker en kunde på drone, vises bare dronebildene dine.</p>
        ${pf.length ? `<div class="pf-grid">${pf.map((x, i) => `<div class="pf-item"><img src="${H.esc(x.thumb || x.url)}" alt="${x.type === 'video' ? 'Video' : 'Bilde'} ${i + 1} i porteføljen">${x.type === 'video' ? `<span class="play-badge">${H.icon('play', 14, 2, 'currentColor')}</span>` : ''}<button type="button" class="ibtn" data-a="rmPf" data-v="${i}" aria-label="Fjern bilde ${i + 1}">${H.icon('close', 14, 2.4)}</button>${`<select class="pf-cat" data-pfcat="${i}" aria-label="Fagfelt for bilde ${i + 1}">${catOpts(x.cat)}</select>`}</div>`).join('')}</div>` : ''}
        <div class="row">${pf.length < PF_MAX ? `<label class="row small" style="gap:6px"><span class="muted">Last opp til</span><select class="inp sm" id="upCat" style="width:auto;height:36px;padding:0 10px">${catOpts(upCat)}</select></label>` : ''}${pf.length < PF_MAX ? `<label class="btn soft sm" for="pfFile">${H.icon('plus', 16, 2.2)} Legg til bilder eller video</label><input type="file" id="pfFile" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" multiple class="sr">` : ''}<span class="hint" id="pfStatus">${H.esc(pfBusy)}</span></div>
      </fieldset>
      <label class="check"><input type="checkbox" id="legal" ${p.id ? 'checked' : ''}> <span>Jeg driver lovlig virksomhet og rapporterer inntekten min. Jeg godtar <a href="vilkar.html" target="_blank">vilkårene for frilansere</a>.</span></label>
      <div id="err"></div>
      <div class="row"><button class="btn primary" type="submit">${S.profile ? 'Lagre endringer' : 'Publiser profil'}</button>${S.profile ? `<a class="btn soft" href="frilanser.html?id=${S.profile.id}">Se profilen</a>` : ''}</div>
    </form>
    <aside><div class="banner acc">${H.icon('shield', 20)}<span>${S.user.method === 'E-post' ? 'Merket «BankID-verifisert» kommer når innlogging med Vipps og BankID er på plass.' : `Profilen får merket «BankID-verifisert» fordi du logget inn med ${H.esc(S.user.method)}.`}</span></div>
      <div class="card stack small"><b style="font-size:15px">Utbetaling</b><span class="muted">I den ferdige appen legger du inn kontonummer hos betalingspartneren vår. Freelio ser aldri kontonummeret ditt.</span><span class="muted">Du betaler 5 % av hvert oppdrag. Ingen faste kostnader.</span></div></aside>
  </div></div>`;
  H.bindPhotoPicker(() => form());
  // Bilder fra porteføljen som ikke kan vises (for eksempel blokkert av nettsiden), skjules
  document.querySelectorAll('.imp-pick img').forEach((img) => img.addEventListener('error', () => { img.closest('.imp-pick').hidden = true; }));
  const pfIn = document.getElementById('pfFile');
  if (pfIn) pfIn.addEventListener('change', async () => {
    const files = [...pfIn.files].slice(0, PF_MAX - pf.length); pfIn.value = '';
    const big = window.Cloud && Cloud.on ? 1600 : 900, small = window.Cloud && Cloud.on ? 600 : 400;
    for (let i = 0; i < files.length; i++) {
      pfBusy = `Laster opp ${i + 1} av ${files.length} …`; form();
      try {
        if (/^video\//.test(files[i].type)) {
          const vid = await H.fitVideo(files[i], (pc) => { const el = document.getElementById('pfStatus'); if (el) el.textContent = `Gjør videoen mindre … ${pc} %`; });
          if (vid !== files[i]) { pfBusy = `Laster opp ${i + 1} av ${files.length} …`; form(); }
          const poster = await H.videoPoster(files[i]).catch(() => H.videoPoster(vid));
          const thumb = await H.storeImage('thumb', poster.blob);
          pf.push({ type: 'video', url: await H.storeImage('video', vid), thumb, w: poster.w, h: poster.h, dur: poster.dur, cat: upCat });
        } else {
          const a = await H.resizeImage(files[i], big), b = await H.resizeImage(files[i], small);
          pf.push({ url: await H.storeImage('portfolio', a.blob), thumb: await H.storeImage('thumb', b.blob), w: a.w, h: a.h, cat: upCat });
        }
      } catch (e) { H.toast(files[i].name + ': ' + (e.message || 'kunne ikke lastes opp')); }
    }
    pfBusy = ''; form();
  });
  const cIn = document.getElementById('coverFile');
  cIn.addEventListener('change', async () => { const file = cIn.files[0]; cIn.value = ''; if (file) editCover(file); });
  const kIn = document.getElementById('cardFile');
  kIn.addEventListener('change', async () => {
    const file = kIn.files[0]; kIn.value = ''; if (!file) return;
    const blob = await H.cropImage(file, { aspect: 4 / 3, outW: CLOUD ? 1200 : 800, title: 'Juster bildet på kortet', hint: 'Dra bildet for å flytte det, og zoom for å velge utsnittet. Slik ser kortet ditt ut i søket og på forsiden.' });
    if (!blob) return;
    cardBusy = 'Laster opp …'; form();
    try {
      const b = await H.resizeImage(blob, 600);
      const old = card;
      card = { url: await H.storeImage('card', blob), thumb: await H.storeImage('thumb', b.blob) };
      if (old) { H.dropImage(old.url); H.dropImage(old.thumb); }
    } catch (e) { H.toast(e.message || 'Bildet kunne ikke lastes opp'); }
    cardBusy = ''; form();
  });
  const pf_ = document.getElementById('pform');
  pf_.addEventListener('input', (e) => { const k = e.target.dataset.pk; if (k) { const [i, j] = k.split(':').map(Number); pkgs[i][j] = e.target.value; } else if (e.target.id && e.target.id !== 'legal' && e.target.tagName !== 'SELECT' && e.target.type !== 'file') { draft[e.target.id] = e.target.value; } });
  pf_.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.niche) { const id = t.dataset.niche; niches = t.checked ? niches.concat(id) : niches.filter((n) => n !== id); form(); return; }
    // Velger du et fagfelt du ikke har krysset av, blir det lagt til
    if (t.dataset.pfcat) { pf[+t.dataset.pfcat].cat = t.value; if (!niches.includes(t.value)) { niches.push(t.value); form(); } return; }
    if (t.id === 'upCat') { upCat = t.value; if (!niches.includes(t.value)) { niches.push(t.value); form(); } return; }
    if (t.id === 'cat') {
      // Bytter hovedområde: det gamle fjernes fra listen, det nye legges til
      const prev = draft.cat || (H.S.profile && H.S.profile.cat) || HDATA.CATS[0].id;
      niches = niches.filter((n) => n !== prev); draft.cat = t.value;
      pf.forEach((x) => { if (x.cat === prev) x.cat = t.value; }); form(); return;
    }
    if (t.tagName === 'SELECT') draft[t.id] = t.value;
  });
  // Enter i et tekstfelt skal ikke publisere profilen. Profilen lagres bare med knappen.
  pf_.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'impUrl') { e.preventDefault(); H.actions.impFetch(); return; }
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !['checkbox', 'radio', 'file', 'submit', 'button'].includes(e.target.type)) e.preventDefault();
  });
  pf_.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (saving) return;
    const v = (id) => document.getElementById(id).value.trim();
    const pk = pkgs.filter((x) => x[0].trim() && +String(x[1]).replace(/\D/g, '')).map((x) => [x[0].trim(), +String(x[1]).replace(/\D/g, ''), x[2].trim()]);
    const miss = ['name', 'role', 'area', 'bio', 'years'].filter((k) => !v(k));
    const years = Math.round(+v('years'));
    let msg = '';
    if (miss.length) msg = 'Fyll ut navn, tittel, område, erfaring og om deg.';
    else if (!(years >= 0 && years <= 60)) msg = 'Skriv antall år erfaring som et tall mellom 0 og 60.';
    else if (!pk.length) msg = 'Legg inn minst én pakke med navn og pris.';
    else if (!document.getElementById('legal').checked) msg = 'Du må bekrefte at du driver lovlig og godta vilkårene.';
    if (msg) { document.getElementById('err').innerHTML = `<div class="banner bad">${msg}</div>`; return; }
    const name = v('name');
    const mc = document.getElementById('cat').value;
    const nich = [mc].concat(niches.filter((n) => n !== mc && HDATA.CATS.some((c) => c.id === n)));
    pf.forEach((x) => { if (!nich.includes(x.cat)) x.cat = mc; });
    const ini = name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const old = S.profile || {};
    // Omtrentlig posisjon til kartet. Finnes ikke stedet, lagres profilen likevel.
    let pos = old.lat != null && old.area === v('area') ? [old.lat, old.lng] : null;
    if (!pos) {
      saving = true; const btn = pf_.querySelector('button[type="submit"]'); if (btn) { btn.disabled = true; btn.textContent = 'Lagrer …'; }
      pos = await Promise.race([H.geocode(v('area')).catch(() => null), new Promise((r) => setTimeout(() => r(null), 4000))]);
      saving = false;
    }
    S.profile = Object.assign({ rating: 0, reviews: 0, jobs: 0, respH: 1, resp: '1 time', delD: 7, years: 1, free: true, verified: true, mx: 48, my: 46, km: 0, pal: 2, col: '#0B6E5F', joined: '2026', rv: [], sum: 'Ny på Freelio. Ingen omtaler ennå.' }, old, {
      id: window.Cloud && Cloud.on ? Cloud.uid : 'meg', name, ini, cat: v('cat') || document.getElementById('cat').value, role: v('role'), area: v('area'), reach: +document.getElementById('reach').value, bio: v('bio'), terms: v('terms'),
      niches: nich, tags: nich.map((n) => H.cat(n).name), pk, portfolio: pf, coverImg: cover, cardImg: card, lat: pos ? pos[0] : null, lng: pos ? pos[1] : null, years, respH: +document.getElementById('respH').value, resp: RESP.find((r) => r[0] == document.getElementById('respH').value)[1], delD: +document.getElementById('delD').value, free: document.getElementById('free').value === '1', photo: (S.user && S.user.photo) || null, verified: S.user.method !== 'E-post', from: Math.min(...pk.map((x) => x[1])), unit: '', cap: 'Nytt arbeid fra ' + name.split(' ')[0], published: true
    });
    H.save();
    H.flash(old.id ? 'Profilen er oppdatert.' : 'Profilen er publisert. Nå kan du sende tilbud på oppdrag.');
    H.go(safeNext || 'frilanser.html?id=' + S.profile.id);
  });
}
Object.assign(H.actions, {
  editCover: () => editCover(null),
  rmCover: () => { if (cover) { H.dropImage(cover.url); H.dropImage(cover.thumb); H.dropImage(cover.src); } cover = null; form(); },
  rmCard: () => { if (card) { H.dropImage(card.url); H.dropImage(card.thumb); } card = null; form(); },
  rmPf: (v) => { const x = pf.splice(+v, 1)[0]; if (x) { H.dropImage(x.url); H.dropImage(x.thumb); } form(); },
  addPk: () => { pkgs.push(['', '', '']); form(); },
  rmPk: (v) => { pkgs.splice(+v, 1); form(); },
  impFetch: async () => {
    if (imp.busy) return;
    let url = (document.getElementById('impUrl').value || '').trim(); draft.impUrl = url;
    if (!url) { imp.err = 'Lim inn en lenke først.'; form(); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    impReset(); imp.busy = 'Henter …'; form();
    try {
      const r = await Cloud.sb.functions.invoke('hent-portefolje', { body: { url } });
      if (r.error) throw new Error(await fnError(r.error));
      const f = r.data || {};
      f.images = Array.isArray(f.images) ? f.images.filter((s) => typeof s === 'string' && /^https?:\/\//.test(s)) : [];
      try { f.host = new URL(f.url || url).hostname; } catch (e) { f.host = url; }
      // Beskrivelsen legges inn bare hvis «Om deg» er tom
      const bio = document.getElementById('bio');
      if (f.description && !(bio && bio.value.trim())) { draft.bio = String(f.description).slice(0, 1500); f.usedBio = true; }
      imp.found = f;
    } catch (e) { imp.err = e.message || 'Kunne ikke hente siden.'; }
    imp.busy = ''; form();
  },
  impPick: (v) => {
    const i = +v, at = imp.sel.indexOf(i);
    if (at > -1) imp.sel.splice(at, 1);
    else if (imp.sel.length >= PF_MAX - pf.length) { H.toast(`Du har plass til ${PF_MAX - pf.length} bilder til i porteføljen.`); return; }
    else imp.sel.push(i);
    form();
  },
  impAdd: async () => {
    const f = imp.found; if (!f || imp.busy || !imp.sel.length) return;
    const list = imp.sel.slice(0, PF_MAX - pf.length).map((i) => f.images[i]);
    let ok = 0, why = '';
    for (let i = 0; i < list.length; i++) {
      imp.busy = `Henter ${i + 1} av ${list.length} …`; form();
      try {
        const r = await Cloud.sb.functions.invoke('hent-portefolje', { body: { image: list[i] } });
        if (r.error) throw new Error(await fnError(r.error));
        // Funksjonen sender bildet som en vanlig fil. Typen settes til bilde, så det kan skaleres.
        let blob = r.data instanceof Blob ? r.data : new Blob([r.data]);
        const type = (r.response && r.response.headers.get('X-Image-Type')) || '';
        if (!/^image\//.test(blob.type)) blob = new Blob([blob], { type: /^image\/(jpeg|png|webp|avif)$/.test(type) ? type : 'image/jpeg' });
        const a = await H.resizeImage(blob, 1600), b = await H.resizeImage(blob, 600);
        pf.push({ url: await H.storeImage('portfolio', a.blob), thumb: await H.storeImage('thumb', b.blob), w: a.w, h: a.h, cat: upCat });
        ok++;
      } catch (e) { console.error(e); why = why || e.message || ''; }
    }
    impReset();
    if (ok < list.length) imp.err = `${list.length - ok} av bildene kunne ikke hentes${why ? ` (${why})` : ''}. Last dem opp selv om du vil ha dem med.`;
    form();
    H.toast(ok ? `La til ${ok} ${ok === 1 ? 'bilde' : 'bilder'} i porteføljen. Husk å lagre profilen.` : 'Ingen av bildene kunne hentes.');
  },
  impClose: () => { impReset(); form(); }
});
H.boot(() => (H.S.user ? form() : intro()));
</script>
