<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bli frilanser | Freelio</title>
<meta name="description" content="Lag en gratis frilanserprofil og få oppdrag i nærheten.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="bli-frilanser">
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>
<script src="js/logo.js"></script>
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/cloud.js"></script>
<script type="text/freelio">
const next = H.qs('neste');
const safeNext = next && /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next) ? next : null;
function intro() {
  document.getElementById('main').innerHTML = `<section class="hero"><div class="wrap hero-in"><div class="stack" style="gap:18px"><h1>Få oppdrag <em>i nærheten</em>, og få betalt uten å purre.</h1><p>Vis frem arbeidet ditt, motta forespørsler og send tilbud på oppdrag. Pengene er sikret før du starter.</p><div class="row"><a class="btn primary" href="logg-inn.html?neste=bli-frilanser.html">Kom i gang gratis</a><a class="btn ghost" href="slik-fungerer-det.html#priser">Se priser</a></div></div><div class="mosaic" aria-hidden="true">${[3, 7, 9, 0, 5, 11].map((i) => `<span class="ph" style="${H.phStyle(i)}"></span>`).join('')}</div></div></section>
  <div class="wrap section"><div class="steps3">
    <div class="card"><span class="n">1</span><h3>Lag profil</h3><p class="muted">Logg inn med BankID, legg inn arbeid, pakker og område.</p></div>
    <div class="card"><span class="n">2</span><h3>Få forespørsler</h3><p class="muted">Kunder booker deg direkte, eller du sender tilbud på oppdrag.</p></div>
    <div class="card"><span class="n">3</span><h3>Lever og få betalt</h3><p class="muted">Pengene er betalt inn før du starter. Utbetaling innen 2 virkedager etter godkjenning.</p></div></div></div>`;
}
let pkgs, pf, cover; const draft = {};
const CLOUD = !!(window.Cloud && Cloud.on);
const PF_MAX = CLOUD ? 24 : 8;
const VID_MB = CLOUD ? 50 : 3;
let pfBusy = '', coverBusy = '';
// Lager et stillbilde fra videoen som brukes i rutenettet
function videoPoster(file) {
  return new Promise((res, rej) => {
    const v = document.createElement('video'), u = URL.createObjectURL(file);
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = u;
    v.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Nettleseren kan ikke lese denne videoen. Prøv MP4.')); };
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 3); };
    v.onseeked = () => {
      const k = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(u); b ? res({ blob: b, w: v.videoWidth, h: v.videoHeight, dur: Math.round(v.duration) }) : rej(new Error('Kunne ikke lage forhåndsvisning.')); }, 'image/jpeg', 0.82);
    };
  });
}
function form() {
  const S = H.S; const p = Object.assign({}, S.profile || {}, draft);
  pkgs = pkgs || (p.pk ? p.pk.map((x) => x.slice()) : [['', '', '']]);
  pf = pf || (p.portfolio || []).slice();
  if (cover === undefined) cover = p.coverImg || null;
  document.getElementById('main').innerHTML = `<div class="wrap" style="max-width:1000px"><div class="two">
    <form class="stack" style="gap:20px" id="pform" novalidate>
      <div class="stack" style="gap:6px"><h1>${S.profile ? 'Rediger frilanserprofil' : 'Lag frilanserprofil'}</h1><p class="muted">Profilen vises i søk, på kart og i feeden når du publiserer.</p></div>
      <section class="card">${H.photoPicker(S.user)}</section>
      <section class="card stack" style="gap:10px"><b style="font-size:15px">Bakgrunnsbilde</b>
        <div class="cover-pick">${cover ? `<img src="${H.esc(cover.url)}" alt="Bakgrunnsbildet ditt">` : `<span class="hint">Ingen valgt. Det første bildet i porteføljen brukes.</span>`}</div>
        <div class="row"><label class="btn soft sm" for="coverFile">${H.icon('plus', 16, 2.2)} ${cover ? 'Bytt bakgrunnsbilde' : 'Velg bakgrunnsbilde'}</label><input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp" class="sr">${cover ? '<button type="button" class="btn link small" data-a="rmCover">Fjern</button>' : ''}<span class="hint" id="coverStatus">${H.esc(coverBusy)}</span></div>
        <span class="hint">Vises øverst på profilen og på kortet ditt i søket. Bruk et bredt bilde, gjerne 1600 piksler eller mer.</span></section>
      <div class="grid2"><label class="field"><span class="label">Navn *</span><input class="inp" id="name" value="${H.esc(p.name || S.user.name)}"></label>
      <label class="field"><span class="label">Hovedområde *</span><select class="inp" id="cat">${HDATA.CATS.map((c) => `<option value="${c.id}" ${p.cat === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select></label></div>
      <label class="field"><span class="label">Tittel *</span><input class="inp" id="role" value="${H.esc(p.role || '')}" placeholder="F.eks. Bryllupsfotograf, Videograf, Dronepilot"></label>
      <div class="grid2"><label class="field"><span class="label">Område *</span><input class="inp" id="area" value="${H.esc(p.area || '')}" placeholder="F.eks. Sandvika"></label>
      <label class="field"><span class="label">Hvor langt reiser du?</span><select class="inp" id="reach">${[5, 10, 25, 50].map((k) => `<option value="${k}" ${p.reach == k ? 'selected' : ''}>Inntil ${k} km</option>`).join('')}</select></label></div>
      <label class="field" style="max-width:240px"><span class="label">Års erfaring *</span><input class="inp" id="years" type="number" min="0" max="60" inputmode="numeric" value="${H.esc(p.years != null ? p.years : '')}" placeholder="F.eks. 3"></label>
      <label class="field"><span class="label">Om deg *</span><textarea class="inp" id="bio" rows="4" placeholder="Hva er du god på, og hva kan kunden forvente?">${H.esc(p.bio || '')}</textarea></label>
      <label class="field"><span class="label">Stikkord</span><input class="inp" id="tags" value="${H.esc((p.tags || []).join(', '))}" placeholder="F.eks. Bryllup, Portrett, Produkt"><span class="hint">Skill med komma. Brukes i søket.</span></label>
      <fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="label" style="margin-bottom:8px">Pakker og priser * <span class="hint" style="font-weight:600">(minst én)</span></legend>
        ${pkgs.map((x, i) => `<div class="card stack" style="gap:8px"><div class="grid2"><input class="inp" data-pk="${i}:0" value="${H.esc(x[0])}" placeholder="Navn, f.eks. Halv dag" aria-label="Pakkenavn ${i + 1}"><input class="inp" data-pk="${i}:1" value="${H.esc(x[1])}" inputmode="numeric" placeholder="Pris i kr" aria-label="Pris ${i + 1}"></div><input class="inp" data-pk="${i}:2" value="${H.esc(x[2])}" placeholder="Hva er inkludert?" aria-label="Beskrivelse ${i + 1}">${pkgs.length > 1 ? `<button type="button" class="btn link small" style="align-self:flex-start" data-a="rmPk" data-v="${i}">Fjern pakke</button>` : ''}</div>`).join('')}
        ${pkgs.length < 4 ? '<button type="button" class="btn soft sm" style="align-self:flex-start" data-a="addPk">Legg til pakke</button>' : ''}</fieldset>
      <fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="label" style="margin-bottom:4px">Portefølje</legend>
        <p class="hint">Last opp dine beste bilder og videoer, gjerne 6 til ${PF_MAX}. Videoer kan være opptil ${VID_MB} MB, helst MP4.</p>
        ${pf.length ? `<div class="pf-grid">${pf.map((x, i) => `<div class="pf-item"><img src="${H.esc(x.thumb || x.url)}" alt="${x.type === 'video' ? 'Video' : 'Bilde'} ${i + 1} i porteføljen">${x.type === 'video' ? `<span class="play-badge">${H.icon('play', 14, 2, 'currentColor')}</span>` : ''}<button type="button" class="ibtn" data-a="rmPf" data-v="${i}" aria-label="Fjern bilde ${i + 1}">${H.icon('close', 14, 2.4)}</button></div>`).join('')}</div>` : ''}
        <div class="row">${pf.length < PF_MAX ? `<label class="btn soft sm" for="pfFile">${H.icon('plus', 16, 2.2)} Legg til bilder eller video</label><input type="file" id="pfFile" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" multiple class="sr">` : ''}<span class="hint" id="pfStatus">${H.esc(pfBusy)}</span></div>
      </fieldset>
      <label class="check"><input type="checkbox" id="legal" ${p.id ? 'checked' : ''}> <span>Jeg driver lovlig virksomhet og rapporterer inntekten min. Jeg godtar <a href="vilkar.html" target="_blank">vilkårene for frilansere</a>.</span></label>
      <div id="err"></div>
      <div class="row"><button class="btn primary" type="submit">${S.profile ? 'Lagre endringer' : 'Publiser profil'}</button>${S.profile ? `<a class="btn soft" href="frilanser.html?id=${S.profile.id}">Se profilen</a>` : ''}</div>
    </form>
    <aside><div class="banner acc">${H.icon('shield', 20)}<span>${S.user.method === 'E-post' ? 'Merket «BankID-verifisert» kommer når innlogging med Vipps og BankID er på plass.' : `Profilen får merket «BankID-verifisert» fordi du logget inn med ${H.esc(S.user.method)}.`}</span></div>
      <div class="card stack small"><b style="font-size:15px">Utbetaling</b><span class="muted">I den ferdige appen legger du inn kontonummer hos betalingspartneren vår. Freelio ser aldri kontonummeret ditt.</span><span class="muted">Du betaler 5 % av hvert oppdrag. Ingen faste kostnader.</span></div></aside>
  </div></div>`;
  H.bindPhotoPicker(() => form());
  const pfIn = document.getElementById('pfFile');
  if (pfIn) pfIn.addEventListener('change', async () => {
    const files = [...pfIn.files].slice(0, PF_MAX - pf.length); pfIn.value = '';
    const big = window.Cloud && Cloud.on ? 1600 : 900, small = window.Cloud && Cloud.on ? 600 : 400;
    for (let i = 0; i < files.length; i++) {
      pfBusy = `Laster opp ${i + 1} av ${files.length} …`; form();
      try {
        if (/^video\//.test(files[i].type)) {
          if (files[i].size > VID_MB * 1048576) throw new Error(`Videoen er over ${VID_MB} MB. Korte den ned eller eksporter i lavere kvalitet.`);
          const poster = await videoPoster(files[i]);
          const thumb = await H.storeImage('thumb', poster.blob);
          pf.push({ type: 'video', url: await H.storeImage('video', files[i]), thumb, w: poster.w, h: poster.h, dur: poster.dur });
        } else {
          const a = await H.resizeImage(files[i], big), b = await H.resizeImage(files[i], small);
          pf.push({ url: await H.storeImage('portfolio', a.blob), thumb: await H.storeImage('thumb', b.blob), w: a.w, h: a.h });
        }
      } catch (e) { H.toast(files[i].name + ': ' + (e.message || 'kunne ikke lastes opp')); }
    }
    pfBusy = ''; form();
  });
  const cIn = document.getElementById('coverFile');
  cIn.addEventListener('change', async () => {
    const file = cIn.files[0]; cIn.value = ''; if (!file) return;
    coverBusy = 'Laster opp …'; form();
    try {
      const a = await H.resizeImage(file, CLOUD ? 2000 : 1200), b = await H.resizeImage(file, 700);
      const old = cover;
      cover = { url: await H.storeImage('cover', a.blob), thumb: await H.storeImage('thumb', b.blob), w: a.w, h: a.h };
      if (old) { H.dropImage(old.url); H.dropImage(old.thumb); }
    } catch (e) { H.toast(e.message || 'Bildet kunne ikke lastes opp'); }
    coverBusy = ''; form();
  });
  const pf_ = document.getElementById('pform');
  pf_.addEventListener('input', (e) => { const k = e.target.dataset.pk; if (k) { const [i, j] = k.split(':').map(Number); pkgs[i][j] = e.target.value; } else if (e.target.id && e.target.id !== 'legal') { draft[e.target.id] = e.target.id === 'tags' ? e.target.value.split(',') : e.target.value; } });
  pf_.addEventListener('change', (e) => { if (e.target.tagName === 'SELECT') draft[e.target.id] = e.target.value; });
  pf_.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = (id) => document.getElementById(id).value.trim();
    const pk = pkgs.filter((x) => x[0].trim() && +String(x[1]).replace(/\D/g, '')).map((x) => [x[0].trim(), +String(x[1]).replace(/\D/g, ''), x[2].trim()]);
    const miss = ['name', 'role', 'area', 'bio', 'years'].filter((k) => !v(k));
    const years = Math.round(+v('years'));
    let msg = '';
    if (miss.length) msg = 'Fyll ut navn, tittel, område, erfaring og om deg.';
    else if (!(years >= 0 && years <= 60)) msg = 'Skriv antall år erfaring som et tall mellom 0 og 60.';
    else if (!pk.length) msg = 'Legg inn minst én pakke med navn og pris.';
    else if (!document.getElementById('legal').checked) msg = 'Du må bekrefte at du driver lovlig og godta vilkårene.';
    if (msg) { document.getElementById('err').innerHTML = `<div class="banner bad">${msg}</div>`; return; }
    const name = v('name');
    const ini = name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
    const old = S.profile || {};
    S.profile = Object.assign({ rating: 0, reviews: 0, jobs: 0, respH: 1, resp: '1 time', delD: 7, years: 1, free: true, verified: true, mx: 48, my: 46, km: 0, pal: 2, col: '#0B6E5F', joined: '2026', rv: [], sum: 'Ny på Freelio. Ingen omtaler ennå.' }, old, {
      id: window.Cloud && Cloud.on ? Cloud.uid : 'meg', name, ini, cat: v('cat') || document.getElementById('cat').value, role: v('role'), area: v('area'), reach: +document.getElementById('reach').value, bio: v('bio'),
      tags: v('tags').split(',').map((t) => t.trim()).filter(Boolean), pk, portfolio: pf, coverImg: cover, years, photo: (S.user && S.user.photo) || null, verified: S.user.method !== 'E-post', from: Math.min(...pk.map((x) => x[1])), unit: '', cap: 'Nytt arbeid fra ' + name.split(' ')[0], published: true
    });
    H.save();
    H.flash(old.id ? 'Profilen er oppdatert.' : 'Profilen er publisert. Nå kan du sende tilbud på oppdrag.');
    H.go(safeNext || 'frilanser.html?id=' + S.profile.id);
  });
}
Object.assign(H.actions, {
  rmCover: () => { if (cover) { H.dropImage(cover.url); H.dropImage(cover.thumb); } cover = null; form(); },
  rmPf: (v) => { const x = pf.splice(+v, 1)[0]; if (x) { H.dropImage(x.url); H.dropImage(x.thumb); } form(); },
  addPk: () => { pkgs.push(['', '', '']); form(); },
  rmPk: (v) => { pkgs.splice(+v, 1); form(); }
});
H.boot(() => (H.S.user ? form() : intro()));
</script>
</body>
</html>
