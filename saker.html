<body data-page="saker">
<div id="site-header"></div>
<main id="main"><div class="wrap" style="max-width:900px"><section class="section" id="box"></section></div></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=f0d4288f"></script>

<script type="text/freelio">
// Sak hos Freelio: admin ser avtalen og meldingene, og avgjør hvordan beløpet som holdes, skal fordeles.
// Databasen sjekker at du er admin, og logger alt (database/juridisk.sql).
let cases = null, err = '', open = '', msgs = {}, refund = {}, note = {}, busy = false;
const $ = (id) => document.getElementById(id);
const day = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' }); };
async function load() {
  if (!H.isAdmin()) { draw(); return; }
  try { cases = await H.adminCases(); err = ''; } catch (x) { err = x.message || 'Kunne ikke hente sakene.'; }
  draw();
}
function caseCard(c) {
  const d = c.data || {}, ctr = d.contract && typeof d.contract === 'object' ? d.contract : null, isOpen = c.status === 'case';
  const on = open === c.id, m = msgs[c.id];
  const r = refund[c.id] != null ? refund[c.id] : '';
  return `<div class="card stack" style="gap:10px">
    <div class="row" style="justify-content:space-between"><b style="font-size:16px">${H.esc(c.title)}</b><span class="pill ${isOpen ? 'bad' : 'ok'}">${isOpen ? 'Åpen sak' : 'Avgjort'}</span></div>
    <span class="meta">Kunde: ${H.esc(c.customer_name)} · Frilanser: ${H.esc(c.freelancer_name)} · ${H.kr(c.price)} · sendt ${H.esc(day(d.caseAt))} av ${H.esc(d.caseBy || 'ukjent')} · ${+d.disputes || 0} ${(+d.disputes || 0) === 1 ? 'klage' : 'klager'}</span>
    ${!isOpen ? `<span class="small">Avgjort ${H.esc(day(d.caseDoneAt))}: kunden fikk ${H.kr(d.refund)} tilbake. ${H.esc(d.caseNote || '')}</span>` : ''}
    <div class="row"><button class="btn soft sm" data-a="caseOpen" data-v="${c.id}">${on ? 'Skjul' : 'Se avtale og meldinger'}</button></div>
    ${on ? `<details class="ctr-more" open><summary>Oppdragsavtale</summary><div class="ctr">${ctr ? H.contractHTML(ctr) : '<p class="muted">Bestillingen har ingen avtale.</p>'}</div></details>
      ${d.deliveryNote ? `<span class="small"><b>Melding med leveransen:</b> ${H.esc(d.deliveryNote)}</span>` : ''}
      <b class="small">Meldinger mellom partene</b>
      ${!m ? '<p class="muted small">Henter …</p>' : !m.length ? '<p class="muted small">Ingen meldinger.</p>' : `<div class="stack" style="gap:6px">${m.map((x) => `<div class="small" style="overflow-wrap:anywhere"><b>${x.sender === 'customer' ? 'Kunde' : x.sender === 'freelancer' ? 'Frilanser' : 'System'}</b> <span class="meta">${H.esc(H.when(x.created_at))}</span><br><span style="white-space:pre-line">${H.esc(x.body)}</span></div>`).join('')}</div>`}
      ${isOpen ? `<form class="stack" data-case="${c.id}" style="gap:10px;border-top:1px solid var(--line);padding-top:12px" novalidate>
        <b>Avgjør saken</b>
        <span class="hint">Avgjørelsen gjelder bare beløpet som holdes. Hør begge parter først. Begrunnelsen vises til begge.</span>
        <label class="field"><span class="label">Kunden får tilbake (kr)</span><input class="inp" data-f="refund" inputmode="numeric" maxlength="7" value="${H.esc(r)}" placeholder="0 til ${Math.round(c.price)}"><span class="hint">0 betyr at frilanseren får hele beløpet. ${H.kr(c.price)} betyr at kunden får alt tilbake.</span></label>
        <label class="field"><span class="label">Begrunnelse</span><textarea class="inp" data-f="note" rows="3" maxlength="1000" placeholder="Hva har du lagt vekt på i avtalen, leveransen og meldingene?">${H.esc(note[c.id] || '')}</textarea></label>
        <div class="row"><button class="btn dark sm" type="submit" ${busy ? 'disabled' : ''}>${busy ? 'Lagrer …' : 'Avgjør saken'}</button></div>
      </form>` : ''}` : ''}
  </div>`;
}
function draw() {
  const box = $('box');
  if (!H.S.user) { box.innerHTML = `<div class="empty">Logg inn for å se denne siden. <a class="btn primary sm" href="logg-inn.html?neste=saker.html">Logg inn</a></div>`; return; }
  if (!H.isAdmin()) { box.innerHTML = `<div class="empty">Denne siden er bare for administratorer i Freelio. <a class="btn soft sm" href="mine-oppdrag.html">Til mine oppdrag</a></div>`; return; }
  const openList = (cases || []).filter((c) => c.status === 'case'), done = (cases || []).filter((c) => c.status !== 'case');
  box.innerHTML = `<div class="section-head"><h1 class="row" style="gap:8px">${H.icon('shield', 24)} Saker hos Freelio</h1><span class="meta">Bare admin ser dette</span></div>
    <p class="muted">Bestillinger der kunden og frilanseren ikke ble enige. All utbetaling er stoppet til saken er avgjort. Alt du leser og avgjør her, logges.</p>
    ${err ? `<div class="banner bad">${H.esc(err)}</div>` : !cases ? '<p class="muted">Henter …</p>' : `
      <h2 style="font-size:20px">Åpne (${openList.length})</h2>${openList.length ? openList.map(caseCard).join('') : '<p class="muted">Ingen åpne saker.</p>'}
      ${done.length ? `<h2 style="font-size:20px">Avgjort (${done.length})</h2>${done.map(caseCard).join('')}` : ''}`}`;
  box.querySelectorAll('form[data-case]').forEach((f) => {
    const id = f.dataset.case;
    f.addEventListener('input', (e) => { if (e.target.dataset.f === 'refund') refund[id] = e.target.value; if (e.target.dataset.f === 'note') note[id] = e.target.value; });
    f.addEventListener('submit', async (e) => {
      e.preventDefault(); if (busy) return;
      const c = cases.find((x) => x.id === id), raw = String(refund[id] == null ? '' : refund[id]).replace(/\s/g, ''), n = +raw, why = (note[id] || '').trim();
      if (raw === '' || !Number.isInteger(n) || n < 0 || n > c.price) { H.toast(`Skriv et helt beløp mellom 0 og ${Math.round(c.price)}.`); return; }
      if (why.length < 10) { H.toast('Skriv en begrunnelse på minst 10 tegn.'); return; }
      busy = true; draw();
      try { await H.adminResolveCase(id, n, why); H.toast('Saken er avgjort. Begge parter har fått beskjed.'); open = ''; busy = false; await load(); }
      catch (x) { busy = false; draw(); H.toast(x.message || 'Kunne ikke avgjøre saken.'); }
    });
  });
}
H.actions.caseOpen = async (v) => {
  open = open === v ? '' : v; draw();
  if (open && !msgs[v]) { try { msgs[v] = await H.adminCaseMessages(v); } catch (x) { msgs[v] = []; H.toast(x.message || 'Kunne ikke hente meldingene.'); } draw(); }
};
H.boot(load);
</script>
</body>
</html>
