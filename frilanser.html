<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frilanser | Freelio</title>
<meta name="description" content="Portefølje, pakker og omtaler.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">

<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">

</head>
<body data-page="frilanser">
<div id="site-header"></div>
<main id="main" data-skel="profile"></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=8c092c05"></script>

<script type="text/freelio">
const id = H.qs('id');
let tab = location.hash === '#omtaler' ? 'rv' : 'work';
// ---------- admin: skjul, steng eller slett frilanseren ----------
let adm = null, admAsk = null, admBusy = false;
const ADM = {
  hide: ['Skjul fra søk', 'Profilen forsvinner fra søk, kart og forsiden. Bestillinger blir stående. Kan angres.', 'admin_hide_freelancer', { p_hide: true }],
  show: ['Vis i søk igjen', 'Profilen blir synlig igjen.', 'admin_hide_freelancer', { p_hide: false }],
  ban: ['Steng kontoen', 'Personen kan ikke logge inn, og profilen skjules. Kan angres.', 'admin_ban_freelancer', { p_ban: true }],
  unban: ['Åpne kontoen', 'Personen kan logge inn igjen. Profilen er fortsatt skjult til du viser den.', 'admin_ban_freelancer', { p_ban: false }],
  del: ['Slett profilen', 'Profilen, tilbudene, meldingene, omtalene og innleggene slettes for godt. Det kan ikke angres.', 'admin_delete_freelancer', {}]
};
async function loadAdm() { if (!H.isAdmin()) return; try { adm = await H.adminDo('admin_freelancer_info', { p_id: id }); } catch (e) { adm = { err: e.message }; } render(); }
function adminCard(f) {
  if (!adm) return `<div class="card stack admin-card"><b class="row" style="gap:8px">${H.icon('shield', 18)} Admin</b><span class="muted small">Henter status …</span></div>`;
  if (adm.err) return `<div class="card stack admin-card"><b class="row" style="gap:8px">${H.icon('shield', 18)} Admin</b><span class="small">${H.esc(adm.err)}</span></div>`;
  const st = [adm.hidden ? 'Skjult fra søk' : adm.published ? 'Synlig i søk' : 'Ikke publisert', adm.banned ? 'Kontoen er stengt' : '', adm.orders ? `${adm.orders} ${adm.orders === 1 ? 'bestilling' : 'bestillinger'}${adm.active ? `, ${adm.active} aktive` : ''}` : 'Ingen bestillinger'].filter(Boolean).join(' · ');
  if (adm.isAdmin) return `<div class="card stack admin-card"><b class="row" style="gap:8px">${H.icon('shield', 18)} Admin</b><span class="muted small">${H.esc(st)}. Dette er en admin-konto og kan ikke fjernes her.</span></div>`;
  if (admAsk) { const a = ADM[admAsk]; return `<div class="card stack admin-card"><b class="row" style="gap:8px">${H.icon('shield', 18)} ${a[0]}?</b><span class="small">${a[1]}</span><label class="field"><span class="label">Grunn (valgfritt, bare til loggen)</span><input class="inp" id="admReason" maxlength="200" placeholder="F.eks. Falsk profil eller spam"></label><div class="row"><button class="btn soft sm grow" data-a="admNo">Avbryt</button><button class="btn ${admAsk === 'del' ? 'dark' : 'primary'} sm grow" data-a="admGo" ${admBusy ? 'disabled' : ''}>${admBusy ? 'Jobber …' : a[0]}</button></div></div>`; }
  return `<div class="card stack admin-card"><b class="row" style="gap:8px">${H.icon('shield', 18)} Admin</b><span class="muted small">${H.esc(st)}</span>
    <div class="row" style="gap:6px"><button class="btn soft sm" data-a="admAsk" data-v="${adm.hidden ? 'show' : 'hide'}">${adm.hidden ? 'Vis i søk igjen' : 'Skjul fra søk'}</button><button class="btn soft sm" data-a="admAsk" data-v="${adm.banned ? 'unban' : 'ban'}">${adm.banned ? 'Åpne kontoen' : 'Steng kontoen'}</button></div>
    ${adm.orders ? '<span class="hint">Har bestillinger, så profilen kan bare skjules, ikke slettes.</span>' : '<button class="btn link small" style="align-self:flex-start;padding:0;color:var(--bad,#c0392b)" data-a="admAsk" data-v="del">Slett profilen for godt</button>'}</div>`;
}
let pcat = H.qs('kat') || 'alle';
function render() {
  const f = H.byId(id);
  const main = document.getElementById('main');
  if (!f) { main.innerHTML = `<div class="wrap section"><div class="empty"><b style="color:var(--fg)">Fant ikke denne frilanseren.</b><span>Profilen kan være fjernet eller lenken er feil.</span><a class="btn primary sm" href="sok.html">Søk etter frilansere</a></div></div>`; return; }
  document.title = f.name + ' | Freelio';
  const saved = H.S.saved.includes(f.id), inCmp = H.S.cmp.includes(f.id);
  // Fordeling av stjerner: ekte omtaler telles. Demo-frilansere har i tillegg et anslått grunnlag.
  const dist = [5, 4, 3, 2, 1].map((s) => {
    // De første «realReviews» i listen er ekte omtaler fra databasen. Teller dem etter antall stjerner.
    const real = (f.rv || []).slice(0, f.realReviews || 0).filter((r) => Number(r[1]) === s).length;
    const baseN = f.reviews - (f.realReviews || 0);
    const share = { 5: 0.82, 4: 0.13, 3: 0.03, 2: 0.01, 1: 0.01 }[s];
    return [s, real + (f.demo === false ? 0 : Math.round(baseN * share))];
  });
  const pcats = [...new Set((f.portfolio || []).map((x) => x.cat || f.cat))];
  const pc = pcats.includes(pcat) ? pcat : 'alle';
  const tabs = { work: 'Portefølje', pk: 'Pakker og priser', rv: `Omtaler (${f.reviews})`, about: 'Om' };
  const body = {
    work: (f.portfolio && f.portfolio.length) ? `${pcats.length > 1 ? `<div class="chips scroll" style="margin-bottom:14px">${['alle'].concat(pcats).map((c) => `<button class="chip" data-a="pcat" data-v="${c}" aria-pressed="${pc === c}">${c === 'alle' ? 'Alle' : H.cat(c).name}</button>`).join('')}</div>` : ''}<div class="gallery">${f.portfolio.map((x, i) => pc !== 'alle' && (x.cat || f.cat) !== pc ? '' : x.type === 'video' ? `<button class="ph has-img" data-a="viewPf" data-v="${i}" aria-label="Spill av video ${i + 1} fra ${H.esc(f.name)}"><img class="cover" src="${H.esc(x.thumb)}" alt="" loading="lazy"><span class="play-badge">${H.icon('play', 16, 2, 'currentColor')}</span></button>` : `<button class="ph has-img" data-a="viewPf" data-v="${i}" aria-label="Vis bilde ${i + 1} fra ${H.esc(f.name)}"><img class="cover" src="${H.esc(x.thumb || x.url)}" alt="" loading="lazy"></button>`).join('')}</div>`
      : f.demo === false ? `<div class="empty">${H.esc(H.first(f.name))} har ikke lastet opp bilder ennå.</div>` : `<div class="gallery">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => `<span class="ph" role="img" aria-label="Arbeid ${i + 1} fra ${H.esc(f.name)}" style="${H.phStyle(f.pal + i)}"></span>`).join('')}</div>`,
    pk: `<div class="stack">${f.pk.map((p, i) => `<a class="card pkg" href="book.html?id=${f.id}&pk=${i}" style="text-decoration:none;color:var(--fg)"><span class="pkg-top"><span>${H.esc(p[0])}</span><span>${H.kr(p[1])}</span></span><span class="muted">${H.esc(p[2])}</span><span class="small" style="font-weight:700">Book denne pakken →</span></a>`).join('')}<p class="hint">Booking skjer med <a href="avtale.html">Freelios oppdragsavtale</a>${f.terms ? ` og vilkårene til ${H.esc(H.first(f.name))} (under Om)` : ''}. Du godtar den før du betaler.</p>
      <p class="hint">Trenger du noe annet? Send en melding, eller legg ut et oppdrag med eget budsjett.</p></div>`,
    rv: f.reviews === 0 ? `<div class="empty"><b style="color:var(--fg)">Ingen omtaler ennå</b><span>Omtaler kommer fra kunder som har booket og betalt via Freelio.</span></div>`
      : `<div class="stack" style="gap:20px">${f.demo !== false && f.sum ? `<div class="banner acc">${H.icon('spark', 20)}<span><b>Oppsummert av assistenten.</b> ${H.esc(f.sum)}</span></div>` : ''}
      <div class="grid2"><div class="stack" style="gap:2px"><span style="font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1">${H.ratingTxt(f)}</span><span class="rate" aria-label="${H.ratingTxt(f)} av 5 stjerner">${[1, 2, 3, 4, 5].map((k) => `<span style="color:${k <= Math.round(f.rating) ? 'var(--star)' : 'var(--surface2)'};display:inline-flex">${H.star(18)}</span>`).join('')}</span><span class="muted small">${f.reviews} ${f.reviews === 1 ? 'omtale' : 'omtaler'} fra kunder som har betalt via Freelio</span></div>
      <div class="bars">${dist.map(([s, c]) => `<div><span>${s} ${s === 1 ? 'stjerne' : 'stjerner'}</span><i><b style="width:${f.reviews ? (c / f.reviews) * 100 : 0}%"></b></i><span>${c}</span></div>`).join('')}</div></div>
      <div>${f.rv.map((r) => `<div class="rev"><div class="row" style="justify-content:space-between"><b>${H.esc(r[0])}</b><span class="rate" style="color:var(--star)">${H.star(14).repeat(r[1])}<span class="sr">${r[1]} av 5</span></span></div><span class="meta">${H.esc(r[2])}</span><span>${H.esc(r[3])}</span>${r[4] ? '<span class="pill acc" style="align-self:flex-start">Din omtale</span>' : ''}${H.isAdmin() && r[6] ? `<button class="btn link small" style="align-self:flex-start;padding:0" data-a="adminDelReview" data-v="${H.esc(r[6])}">Fjern omtalen (admin)</button>` : ''}</div>`).join('')}</div></div>`,
    about: `<div class="prose"><p>${H.esc(f.bio)}</p><ul><li>Område: ${H.esc(f.area)} og omegn</li><li>Spesialiserer seg på: ${f.tags.map(H.esc).join(', ')}</li><li>Medlem siden ${H.esc(f.joined)}</li>${f.verified ? '<li>Identitet bekreftet med BankID</li>' : ''}</ul>${f.terms ? `<h2>Vilkår fra ${H.esc(H.first(f.name))}</h2><p style="white-space:pre-line">${H.esc(f.terms)}</p>` : ''}<p class="hint">Alle bookinger følger <a href="avtale.html">Freelios oppdragsavtale</a>. Pengene holdes trygt til du har godkjent leveransen, og ${H.esc(H.first(f.name))} eier bildene frem til du godkjenner.</p></div>`
  }[tab];
  const similar = H.all().filter((x) => x.id !== f.id && (f.niches || [f.cat]).some((n) => H.inCat(x, n))).slice(0, 4);
  main.innerHTML = `
  <div class="wrap"><div class="crumbs"><a href="index.html">Forside</a><span>/</span><a href="sok.html?kat=${f.cat}">${H.cat(f.cat).name}</a><span>/</span><span>${H.esc(f.name)}</span></div></div>
  <div class="wrap" style="margin-top:12px">${H.ph(f, 'cover', 'cover', 'div', 'style="border-radius:20px"', '', true)}
    <div class="prof-head" style="padding-inline:20px">${H.avatar(f, 104).replace('class="av" style="', 'class="av" style="box-shadow:0 0 0 5px var(--bg);')}
      <div class="stack grow" style="gap:4px;padding-bottom:6px"><h1>${H.esc(f.name)}</h1><span class="muted">${H.esc(f.role)} · ${H.esc(f.area)}${f.km ? ` · ${f.km} km fra deg` : ""}</span></div></div>
  </div>
  <div class="wrap prof-grid">
    <div class="stack" style="gap:20px">
      <div class="row small muted" style="gap:16px">${f.verified ? '<span class="row" style="gap:6px">' + H.icon('shield', 15, 2) + ' BankID-verifisert</span>' : ''}<span class="row" style="gap:6px">${H.icon('clock', 15, 2)} Svarer innen ${H.esc(f.resp)}</span><span class="row" style="gap:6px"><span style="width:7px;height:7px;border-radius:4px;background:${f.free ? 'var(--ok)' : 'var(--warn)'}"></span>${f.free ? 'Ledig kapasitet' : 'Få ledige datoer'}</span></div>
      <div class="stats"><div><b>${H.ratingTxt(f)}</b><span>${f.reviews ? f.reviews + (f.reviews === 1 ? ' omtale' : ' omtaler') : 'Ingen omtaler ennå'}</span></div><div><b>${f.years} år</b><span>erfaring</span></div><div><b>${f.delD ? f.delD + ' d' : 'Samme dag'}</b><span>levering</span></div><div><b>${f.jobs}</b><span>oppdrag</span></div></div>
      <div class="tabs" role="tablist">${Object.entries(tabs).map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" data-a="tab" data-v="${k}">${t}</button>`).join('')}</div>
      <div role="tabpanel">${body}</div>
    </div>
    <aside class="prof-side">
      <div class="card stack">
        <span class="muted small">Pris</span><span style="font-size:26px;font-weight:800">${H.priceTxt(f)}</span>
        <a class="btn primary block" href="book.html?id=${f.id}">Book ${H.esc(H.first(f.name))}</a>
        <a class="btn ghost block" href="meldinger.html?med=${f.id}">${H.icon('chat', 18)} Send melding</a>
        <div class="row" style="gap:8px"><button class="btn soft sm grow" data-a="save" data-v="${f.id}" aria-pressed="${saved}">${H.icon('heart', 16, 1.8, saved ? 'currentColor' : 'none')} ${saved ? 'Lagret' : 'Lagre'}</button><button class="btn soft sm grow" data-a="cmp" data-v="${f.id}" aria-pressed="${inCmp}">${H.icon(inCmp ? 'check' : 'columns', 16, 2)} ${inCmp ? 'I sammenligning' : 'Sammenlign'}</button></div>
        <button class="btn link small" style="align-self:flex-start" data-a="folder" data-v="f:${f.id}">${H.inFolders('f', f.id).length ? 'Lagret i ' + H.inFolders('f', f.id).map((m) => H.esc(m.name)).join(', ') + '. Endre mapper' : 'Legg i mappe'}</button>
        ${H.S.cmp.length >= 2 ? `<a href="sammenlign.html" class="small">Gå til sammenligning (${H.S.cmp.length})</a>` : ''}
      </div>
      ${H.isAdmin() && !(H.S.profile && H.S.profile.id === f.id) ? adminCard(f) : ''}
      <div class="banner acc">${H.icon('lock', 20)}<span>Trygg betaling. Pengene holdes til du har godkjent leveransen. <a href="slik-fungerer-det.html#betaling">Slik fungerer det</a></span></div>
      <p class="hint">Hold samtalen og betalingen i Freelio. Da er du dekket hvis noe går galt.</p>
    </aside>
  </div>
  ${similar.length ? `<div class="wrap section"><h2>Lignende frilansere</h2><div class="cards">${similar.map((x) => H.fCard(x)).join('')}</div></div>` : ''}`;
}
H.actions.tab = (v) => { tab = v; render(); };
H.actions.admAsk = (v) => { admAsk = v; render(); const i = document.getElementById('admReason'); if (i) i.focus(); };
H.actions.admNo = () => { admAsk = null; render(); };
H.actions.admGo = async () => {
  const a = ADM[admAsk]; if (!a || admBusy) return;
  const reason = H.clip((document.getElementById('admReason') || {}).value || '', 200);
  admBusy = true; render();
  try {
    await H.adminDo(a[2], Object.assign({ p_id: id, p_reason: reason }, a[3]));
    if (admAsk === 'del') { H.flash('Profilen er slettet.'); H.go('sok.html'); return; }
    H.toast(a[0] + ': gjort.'); admAsk = null; admBusy = false;
    if (H.refresh) await H.refresh();
    await loadAdm();
  } catch (e) { admBusy = false; H.toast(e.message); render(); }
};
H.actions.adminDelReview = async (v) => {
  if (!confirm('Fjerne denne omtalen for godt?')) return;
  try {
    await H.adminDo('admin_delete_review', { p_id: v, p_reason: '' });
    Object.values(H.S.extraReviews || {}).forEach((l) => { const i = l.findIndex((r) => r[6] === v); if (i > -1) l.splice(i, 1); });
    H.toast('Omtalen er fjernet.'); render();
  } catch (e) { H.toast(e.message); }
};
H.actions.pcat = (v) => { pcat = v; render(); };
// Bla gjennom porteføljen i en visning på siden, uten å åpne ny fane.
// Piler, piltastene eller sveip på mobil. Lukk med Esc, krysset eller klikk utenfor.
H.actions.viewPf = (v) => {
  const f = H.byId(id); const pfl = (f && f.portfolio) || []; if (!pfl[+v]) return;
  const pcats = [...new Set(pfl.map((x) => x.cat || f.cat))];
  const pc = pcats.includes(pcat) ? pcat : 'alle';
  const list = pfl.map((x, i) => i).filter((i) => pc === 'alle' || (pfl[i].cat || f.cat) === pc);
  let at = Math.max(0, list.indexOf(+v));
  const last = document.activeElement;
  const lb = document.createElement('div'); lb.className = 'lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Porteføljen til ' + f.name);
  const draw = () => {
    const x = pfl[list[at]];
    lb.innerHTML = `<div class="lb-top"><span class="small" aria-live="polite">${at + 1} / ${list.length}</span><button class="ibtn" data-lb="close" aria-label="Lukk">${H.icon('close', 20, 2)}</button></div>
      <div class="lb-stage">${x.type === 'video' ? `<video src="${H.esc(x.url)}" poster="${H.esc(x.thumb)}" controls autoplay playsinline></video>` : `<img src="${H.esc(x.url)}" alt="Bilde ${at + 1} av ${list.length} fra ${H.esc(f.name)}">`}
      ${list.length > 1 ? `<button class="ibtn lb-nav prev" data-lb="prev" aria-label="Forrige">${H.icon('back', 22, 2)}</button><button class="ibtn lb-nav next" data-lb="next" aria-label="Neste">${H.icon('next', 22, 2)}</button>` : ''}</div>`;
    // Henter nabobildene på forhånd, så neste bilde vises med en gang
    [1, -1].forEach((d) => { const y = pfl[list[(at + d + list.length) % list.length]]; if (y && y.type !== 'video') new Image().src = y.url; });
  };
  const go = (d) => { if (list.length < 2) return; at = (at + d + list.length) % list.length; draw(); };
  const close = () => { document.removeEventListener('keydown', key); lb.remove(); document.body.style.overflow = ''; if (last && last.focus) last.focus(); };
  const key = (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); };
  // Lukker bare når både trykket og slippet skjer på bakgrunnen, så et klikk som starter på en pil aldri lukker visningen
  const bg = (t) => t === lb || (t.classList && t.classList.contains('lb-stage'));
  let downBg = false, sx = null;
  lb.addEventListener('click', (e) => {
    const b = e.target.closest('[data-lb]');
    if (b) { if (b.dataset.lb === 'close') close(); else go(b.dataset.lb === 'next' ? 1 : -1); return; }
    if (bg(e.target) && downBg) close();
  });
  lb.addEventListener('pointerdown', (e) => { downBg = bg(e.target); sx = e.pointerType === 'touch' && e.target.tagName !== 'VIDEO' ? e.clientX : null; });
  lb.addEventListener('pointerup', (e) => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); });
  lb.addEventListener('pointercancel', () => { sx = null; });
  draw(); document.addEventListener('keydown', key); document.body.appendChild(lb); document.body.style.overflow = 'hidden';
  setTimeout(() => { const c = lb.querySelector('[data-lb="close"]'); if (c) c.focus(); }, 30);
};
H.actions.playVid = H.actions.viewPf;
H.boot(() => { render(); loadAdm(); });
</script>
</body>
</html>
