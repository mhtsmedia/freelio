<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oppdrag | Freelio</title>
<meta name="description" content="Oppdrag lagt ut på Freelio.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Freelio">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://hweftjtulzjripkkbdeb.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=df31d6e4">
<link rel="stylesheet" href="css/ny.css?v=1e9d559f" id="ny-css">
<script src="js/design.js?v=7c71ad27"></script>
</head>
<body data-page="annonse">
<div id="site-header"></div>
<main id="main" data-skel="page"></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=8c092c05"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=63cbbc6e"></script>
<script src="js/cloud.js?v=9d24d311"></script>
<script type="text/freelio">
const jid = H.qs('id');
let confirmDelete = false, confirmAdmin = false, offerPrice = '', offerMsg = '';
// Tilbudet kunden holder på å godta, og avtalen som må godtas først
let acceptAt = -1, acTerms = '', acOk = false, acTried = false;
const offerContract = (j, o, f) => H.makeContract(f, { title: j.title, price: o.price, desc: String(j.desc || '').slice(0, 1000), date: j.date, place: j.area, cTerms: acTerms.trim() });
const confirmCard = (j, o, f) => `<div class="card stack ctr-box" style="gap:12px"><b style="font-size:16px">${H.icon('clipboard', 18)} Oppdragsavtale med ${H.esc(H.first(f.name))}</b>
  <p class="hint" style="margin:0">Når du godtar, betaler du ${H.kr(o.price)}. Pengene holdes trygt til du har godkjent leveransen, og ${H.esc(H.first(f.name))} eier bildene frem til du godkjenner.</p>
  ${f.terms ? `<div class="banner acc" style="margin:0">${H.icon('pen', 18)}<span>${H.esc(H.first(f.name))} har egne vilkår. De står i punkt 8 i avtalen.</span></div>` : ''}
  <details class="ctr-more"><summary>Les hele avtalen</summary><div class="ctr">${H.contractHTML(offerContract(j, o, f))}</div></details>
  <label class="field"><span class="label">Tillegg til avtalen (valgfritt)</span><textarea class="inp" id="acTerms" rows="2" maxlength="2000" placeholder="F.eks. Bildene skal ikke publiseres før 1. juni.">${H.esc(acTerms)}</textarea></label>
  <label class="check"><input type="checkbox" id="acOk" ${acOk ? 'checked' : ''}> <span>Jeg har lest og godtar oppdragsavtalen og <a href="vilkar.html" target="_blank">brukervilkårene</a>.</span></label>
  ${acTried && !acOk ? '<span class="err-text">Du må godta avtalen for å gå videre.</span>' : ''}
  <div class="row"><button class="btn soft sm" data-a="noAccept">Avbryt</button><button class="btn primary sm" data-a="confirmAccept" style="margin-left:auto">Godta og betal ${H.kr(o.price)}</button></div></div>`;
let lastCount = -1;
// Hvem som har lagt ut oppdraget. Navnet og bildet kommer fra profilen i databasen (database/oppdragsgiver.sql).
function posterHTML(j) {
  const me = H.S.user;
  const p = j.mine ? { name: (me && me.name) || 'Deg', photo: me && me.photo } : j.poster || { name: j.by || 'Kunde på Freelio' };
  const ini = String(p.name || '?').split(/\s+/).map((w) => w[0] || '').join('').slice(0, 2).toUpperCase();
  const since = p.since ? new Date(p.since).toLocaleDateString('nb-NO', { month: 'long', year: 'numeric' }) : '';
  const facts = [since ? 'Medlem siden ' + since : '', p.jobs ? `${p.jobs} ${p.jobs === 1 ? 'oppdrag' : 'oppdrag'} på Freelio` : ''].filter(Boolean).join(' · ');
  return `<div class="poster">${H.avatar({ name: p.name, ini, col: '#5B5F97', photo: p.photo }, 48)}<div class="stack" style="gap:2px;min-width:0"><span class="meta">Lagt ut av</span><b>${j.mine ? 'Deg' : H.esc(p.name)}</b>${facts ? `<span class="meta">${H.esc(facts)}</span>` : ''}${p.fid ? `<a class="small" href="frilanser.html?id=${encodeURIComponent(p.fid)}">Se frilanserprofilen</a>` : ''}</div></div>`;
}
function render() {
  const S = H.S;
  const j = H.jobById(jid);
  const main = document.getElementById('main');
  if (!j) { main.innerHTML = `<div class="wrap section"><div class="empty">Fant ikke oppdraget. Det kan være slettet. <a class="btn primary sm" href="oppdrag.html">Se andre oppdrag</a></div></div>`; return; }
  document.title = j.title + ' | Freelio';
  const c = H.cat(j.cat);
  const offers = j.mine ? H.jobOffers(j) : [];
  if (j.mine) { const raw = S.myJobs.find((x) => x.id === j.id); H.jobOffers(raw).forEach((o) => (o.seen = true)); H.save(); }
  const sent = S.sentOffers[j.id];
  const facts = [['Maks budsjett', H.kr(j.budget)], ['Dato', j.date], ['Område', j.area + (j.km ? ' (' + j.km + ' km)' : '')], j.scope ? ['Omfang', j.scope] : null, j.delivery ? ['Leveranse', j.delivery] : null, j.ownGear ? ['Utstyr', 'Frilanser tar med eget'] : null].filter(Boolean);
  let side;
  if (j.mine) {
    side = `${j.status === 'open' ? '<div class="card stack push-cta" data-push="kort" hidden></div>' : ''}<div class="card stack"><b>Din annonse</b><span class="muted small">Lagt ut ${H.esc(j.postedTxt || 'nå')}. ${j.status === 'booked' ? 'Oppdraget er booket.' : 'Frilansere i nærheten har fått varsel.'}</span>
      ${confirmDelete ? `<span class="small">${j.status === 'booked' ? 'Vil du slette annonsen? Den forsvinner fra Oppdrag, men bestillingen og betalingen blir stående.' : 'Vil du slette annonsen? Tilbudene forsvinner.'}</span><div class="row"><button class="btn soft sm grow" data-a="noDelete">Avbryt</button><button class="btn dark sm grow" data-a="delete">Slett</button></div>` : `<button class="btn soft block" data-a="askDelete">Slett annonsen</button>`}</div>`;
  } else if (sent) {
    side = `<div class="card stack"><span class="pill ok" style="align-self:flex-start">${H.icon('check', 14, 3)} Tilbud sendt</span><span>Du tilbød <b>${H.kr(sent.price)}</b>.</span><span class="muted small">«${H.esc(sent.msg)}»</span><span class="muted small">Du får beskjed når ${H.esc(j.by)} svarer.</span><button class="btn soft sm" data-a="withdraw">Trekk tilbudet</button></div>`;
  } else if (!S.user) {
    side = `<div class="card stack"><b>Vil du ta oppdraget?</b><span class="muted small">Logg inn og lag en frilanserprofil for å sende tilbud.</span><a class="btn primary block" href="logg-inn.html?neste=${encodeURIComponent('annonse.html?id=' + j.id)}">Logg inn</a></div>`;
  } else if (!S.profile) {
    side = `<div class="card stack"><b>Vil du ta oppdraget?</b><span class="muted small">Du trenger en frilanserprofil for å sende tilbud. Det tar rundt 3 minutter.</span><a class="btn primary block" href="bli-frilanser.html?neste=${encodeURIComponent('annonse.html?id=' + j.id)}">Lag frilanserprofil</a></div>`;
  } else {
    side = `<form class="card stack" id="oform" novalidate><b>Gi et tilbud</b>
      <label class="field"><span class="label">Din pris</span><input class="inp" id="oprice" maxlength="7" inputmode="numeric" data-kr placeholder="Maks ${H.kr(j.budget)}" value="${H.esc(offerPrice)}"></label>
      <label class="field"><span class="label">Melding til kunden</span><textarea class="inp" id="omsg" rows="4" maxlength="1000" placeholder="Hvorfor passer du til jobben? Hva er inkludert?">${H.esc(offerMsg)}</textarea></label>
      <p class="hint">Du får ${offerPrice ? H.kr(+offerPrice.replace(/\D/g, '') * 0.95) : 'prisen minus 5 %'} utbetalt når kunden har godkjent leveransen.</p>
      <button class="btn primary block" type="submit">Send tilbud</button></form>`;
  }
  // Admin: fjern annonser fra andre som bryter reglene
  if (!j.mine && H.isAdmin()) side += `<div class="card stack admin-card"><b class="row" style="gap:8px">${H.icon('shield', 18)} Admin</b>${confirmAdmin
    ? `<span class="small">Fjerne «${H.esc(j.title)}» for godt? Tilbudene på den slettes også. Det kan ikke angres.</span><label class="field"><span class="label">Grunn (valgfritt, bare til loggen)</span><input class="inp" id="adReason" maxlength="200" placeholder="F.eks. Tull eller spam"></label><div class="row"><button class="btn soft sm grow" data-a="noAdminDel">Avbryt</button><button class="btn dark sm grow" data-a="adminDel">Fjern annonsen</button></div>`
    : `<span class="muted small">Du kan fjerne annonser som bryter reglene. Det logges hvem som fjernet hva.</span><button class="btn soft block" data-a="askAdminDel">Fjern annonsen</button>`}</div>`;
  main.innerHTML = `<div class="wrap" style="max-width:1300px">
    <div class="crumbs"><a href="oppdrag.html">Oppdrag</a><span>/</span><a href="oppdrag.html?kat=${c.id}">${c.name}</a><span>/</span><span>${H.esc(j.title)}</span></div>
    <div class="two">
      <div class="stack" style="gap:20px">
        <div class="row" style="gap:6px"><span class="pill">${H.icon(c.icon, 14)} ${c.name}</span>${j.status === 'booked' ? '<span class="pill ok">Booket</span>' : '<span class="pill acc">Åpen for tilbud</span>'}${j.mine ? '' : `<button class="btn soft sm" style="margin-left:auto" data-a="folder" data-v="j:${j.id}" aria-pressed="${H.isSavedItem('j', j.id)}">${H.icon('save', 16, 1.8, H.isSavedItem('j', j.id) ? 'currentColor' : 'none')} ${H.isSavedItem('j', j.id) ? 'Lagret' : 'Lagre'}</button>`}</div>
        <h1>${H.esc(j.title)}</h1>
        <p style="font-size:16px;white-space:pre-line">${H.esc(j.desc)}</p>
        <dl class="sum" style="margin:0">${facts.map(([k, v]) => `<div><dt class="muted">${k}</dt><dd style="margin:0;font-weight:800;text-align:right">${H.esc(v)}</dd></div>`).join('')}</dl>
        ${posterHTML(j)}
        <span class="meta">Lagt ut ${H.esc(j.posted)} · ${j.mine ? offers.length : j.offers + (sent ? 1 : 0)} tilbud</span>
        ${j.mine ? `<section class="stack" aria-live="polite"><h2>Tilbud (${offers.length})</h2>
          ${offers.length ? offers.map((o, i) => { const f = H.byId(o.fid); return `<div class="card stack"><div class="row">${H.avatar(f, 48)}<div class="grow stack" style="gap:0"><a href="frilanser.html?id=${f.id}" style="font-weight:800;color:var(--fg)">${H.esc(f.name)}</a><span class="meta">${H.star(12)} ${H.ratingTxt(f)} · ${f.reviews} omtaler · ${f.km} km · svarer innen ${H.esc(f.resp)}</span></div><b style="font-size:18px">${H.kr(o.price)}</b></div>
            <p>${H.esc(o.msg)}</p>
            ${j.status === 'open' ? acceptAt === i ? confirmCard(j, o, f) : `<div class="row"><a class="btn ghost sm" href="meldinger.html?med=${f.id}">Still spørsmål</a><a class="btn soft sm" href="frilanser.html?id=${f.id}">Se profil</a><button class="btn primary sm" data-a="accept" data-v="${i}" style="margin-left:auto">Godta og betal ${H.kr(o.price)}</button></div>` : (j.acceptedFid === o.fid ? `<a class="pill ok" style="align-self:flex-start;text-decoration:none" href="bestilling.html?id=${encodeURIComponent(j.orderId || '')}">Godtatt. Se bestillingen</a>` : '')}</div>`; }).join('')
          : `<div class="empty">Frilansere i nærheten har fått varsel. Tilbudene dukker opp her, vanligvis innen en time.</div>`}
          ${offers.length >= 2 && j.status === 'open' ? `<button class="btn soft" data-a="compareOffers">${H.icon('columns', 18)} Sammenlign frilanserne som har gitt tilbud</button>` : ''}</section>` : ''}
      </div>
      <aside>${side}<div class="banner acc">${H.icon('lock', 20)}<span>Betaling skjer i Freelio. Pengene holdes til jobben er levert og godkjent.</span></div></aside>
    </div></div>`;
  const act = document.getElementById('acTerms'); if (act) act.addEventListener('input', () => (acTerms = act.value));
  const aok = document.getElementById('acOk'); if (aok) aok.addEventListener('change', () => { acOk = aok.checked; if (acOk && acTried) { acTried = false; render(); } });
  const of = document.getElementById('oform');
  if (of) {
    of.addEventListener('input', () => { offerPrice = document.getElementById('oprice').value; offerMsg = document.getElementById('omsg').value; const h = of.querySelector('.hint'); const p = +offerPrice.replace(/\D/g, ''); h.textContent = `Du får ${p ? H.kr(p * 0.95) : 'prisen minus 5 %'} utbetalt når kunden har godkjent leveransen.`; });
    of.addEventListener('submit', (e) => {
      e.preventDefault();
      const p = H.amount(offerPrice), msg = H.clip(offerMsg, 1000, true);
      const bad = H.priceErr(p) || (!msg ? 'Skriv en kort melding til kunden.' : '') || H.textErr([['Melding til kunden', msg]]);
      if (bad) { H.toast(bad); return; }
      H.S.sentOffers[j.id] = { price: p, msg, at: Date.now() }; H.save();
      H.toast('Tilbudet er sendt.'); render();
    });
  }
  if (j.mine && offers.length !== lastCount) { if (lastCount >= 0 && offers.length > lastCount) H.toast('Nytt tilbud fra ' + H.byId(offers[offers.length - 1].fid).name); lastCount = offers.length; H.mountHeader(); }
  H.pushFill();
}
Object.assign(H.actions, {
  // Først vises avtalen. Betalingen skjer når kunden har godtatt den.
  accept: (v) => {
    if (!H.S.user) { location.href = 'logg-inn.html'; return; }
    acceptAt = +v; acOk = false; acTried = false; render();
  },
  noAccept: () => { acceptAt = -1; render(); },
  confirmAccept: () => {
    const j = H.S.myJobs.find((x) => x.id === jid); const o = H.jobOffers(j)[acceptAt];
    if (!o) return;
    if (!acOk) { acTried = true; render(); return; }
    const f = H.byId(o.fid);
    const order = H.createOrder({ fid: o.fid, title: j.title, price: o.price, date: j.date, place: j.area, jobId: j.id, contract: offerContract(j, o, f) });
    acceptAt = -1;
    j.status = 'booked'; j.acceptedFid = o.fid; j.orderId = order.id; H.save();
    H.flash(`Tilbudet er godtatt. ${H.kr(o.price)} er betalt og holdes trygt.`);
    H.go('bestilling.html?id=' + order.id);
  },
  compareOffers: () => { const j = H.S.myJobs.find((x) => x.id === jid); H.S.cmp = H.jobOffers(j).slice(0, 3).map((o) => o.fid); H.save(); H.go('sammenlign.html'); },
  askAdminDel: () => { confirmAdmin = true; render(); const i = document.getElementById('adReason'); if (i) i.focus(); },
  noAdminDel: () => { confirmAdmin = false; render(); },
  adminDel: async (v, el) => {
    const reason = H.clip((document.getElementById('adReason') || {}).value || '', 200);
    if (el) { el.disabled = true; el.textContent = 'Fjerner …'; }
    try { await H.adminDeleteJob(jid, reason); H.flash('Annonsen er fjernet.'); H.go('oppdrag.html'); }
    catch (e) { H.toast(e.message); confirmAdmin = false; render(); }
  },
  askDelete: () => { confirmDelete = true; render(); },
  noDelete: () => { confirmDelete = false; render(); },
  delete: () => { H.S.myJobs = H.S.myJobs.filter((x) => x.id !== jid); H.save(); H.flash('Annonsen er slettet.'); H.go('mine-oppdrag.html?fane=annonser'); },
  withdraw: () => { delete H.S.sentOffers[jid]; H.save(); H.toast('Tilbudet er trukket.'); render(); }
});
H.boot(render);
if (window.Cloud && Cloud.on) setInterval(async () => { if (document.hidden) return; if (document.activeElement && document.activeElement.matches('input,textarea')) return; await H.refresh(); render(); }, 15000);
setInterval(() => { if (document.hidden) return; const j = H.jobById(jid); if (j && j.mine && j.status === 'open' && H.jobOffers(j).length !== lastCount) render(); }, 2000);
</script>
</body>
</html>
