<meta name="description" content="Oppdragsavtalen mellom kunde og frilanser på Freelio.">

<body data-page="avtale">
<div id="site-header"></div>
<main id="main" data-skel="page"></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=8c092c05"></script>

<script src="js/app.js?v=b1d1dc55"></script>
<script src="js/cloud.js?v=9d24d311"></script>
<script type="text/freelio">
// Med ?id= vises avtalen for én bestilling (bare for kunden og frilanseren). Uten id vises standardavtalen.
const oid = H.qs('id');
function render() {
  const main = document.getElementById('main');
  const o = oid ? H.orderById(oid) : null;
  if (oid && !H.S.user) { location.replace('logg-inn.html?neste=' + encodeURIComponent('avtale.html?id=' + oid)); return; }
  if (oid && !o) { main.innerHTML = `<div class="wrap section"><div class="empty">Fant ikke avtalen. Du ser bare avtaler for dine egne bestillinger. <a class="btn primary sm" href="mine-oppdrag.html">Til mine oppdrag</a></div></div>`; return; }
  const c = o && o.contract && typeof o.contract === 'object' ? o.contract : null;
  if (o && !c) { main.innerHTML = `<div class="wrap section"><div class="empty">Denne bestillingen ble gjort før oppdragsavtalen fantes, og følger <a href="vilkar.html">brukervilkårene</a>. <a class="btn soft sm" href="bestilling.html?id=${encodeURIComponent(o.id)}">Tilbake til bestillingen</a></div></div>`; return; }
  // Standardavtalen med plassholdere
  const shown = c || { v: 1, title: '[Oppdraget]', desc: '', price: 0, date: '[dato]', place: '[sted]', delD: NaN, freelancerName: '[Frilanseren]', customerName: '[Kunden]', fTerms: '', cTerms: '' };
  const who = (at, name) => (at ? `${H.icon('check', 14, 3)} ${H.esc(name)} godtok ${H.esc(H.when(at))}` : `${H.icon('clock', 14, 2)} ${H.esc(name)} har ikke godtatt ennå`);
  main.innerHTML = `<div class="wrap section"><article class="prose ctr-doc">
    ${o ? `<div class="crumbs" style="padding-top:0"><a href="mine-oppdrag.html">Mine oppdrag</a><span>/</span><a href="bestilling.html?id=${encodeURIComponent(o.id)}">${H.esc(o.title)}</a><span>/</span><span>Avtale</span></div>` : ''}
    <h1>Oppdragsavtale</h1>
    <p class="muted">${c ? `Avtale ${H.esc(String(o.id).slice(0, 8).toUpperCase())} · versjon ${+c.v || 1}` : 'Standardavtalen som gjelder for alle bestillinger på Freelio. Når du booker, fylles den ut med parter, pris, dato og eventuelle egne vilkår.'}</p>
    ${c ? `<div class="ctr-status ctr-sign"><span>${who(c.customerAt, c.customerName || 'Kunden')}</span><span>${who(c.freelancerAt, c.freelancerName || 'Frilanseren')}</span></div>` : ''}
    <div class="ctr">${H.contractHTML(shown)}</div>
    <p class="hint">Utkast. Teksten må gjennomgås av advokat før lansering. Se også <a href="vilkar.html">brukervilkårene</a>.</p>
    <div class="row no-print"><button class="btn soft sm" data-a="print">${H.icon('download', 16)} Skriv ut eller lagre som PDF</button>${o ? `<a class="btn link" href="bestilling.html?id=${encodeURIComponent(o.id)}">Tilbake til bestillingen</a>` : ''}</div>
  </article></div>`;
}
H.actions.print = () => window.print();
H.boot(render);
</script>
</body>
</html>
