<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mine oppdrag | Freelio</title>
<meta name="description" content="Bestillinger, annonser og tilbud.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=760da67c">
<link rel="stylesheet" href="css/ny.css?v=9869703e" id="ny-css">
<script src="js/design.js?v=7c71ad27"></script>
</head>
<body data-page="mine-oppdrag">
<div id="site-header"></div>
<main id="main" data-skel="page"></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=a40d434d"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=5f5f374c"></script>
<script src="js/cloud.js?v=a26e07f4"></script>
<script type="text/freelio">
if (H.requireLogin()) {
  let tab = H.qs('fane') || 'bestillinger';
  const pill = (o) => ({ paid: o.role === 'freelancer' ? '<span class="pill warn">Lever jobben</span>' : '<span class="pill acc">Venter på levering</span>', delivered: o.role === 'freelancer' ? '<span class="pill acc">Venter på godkjenning</span>' : '<span class="pill warn">Levert, se over</span>', approved: o.reviewed || o.role === 'freelancer' ? '<span class="pill ok">Fullført</span>' : '<span class="pill warn">Gi omtale</span>', dispute: '<span class="pill bad">Meldt feil</span>', cancelled: '<span class="pill">Avbestilt</span>' }[o.status]);
  function render() {
    const S = H.S;
    const orders = S.orders.slice().sort((a, b) => b.created - a.created);
    const jobs = S.myJobs.slice().reverse();
    const sent = Object.keys(S.sentOffers).map((id) => Object.assign({ job: H.jobById(id) }, S.sentOffers[id])).filter((x) => x.job);
    const tabs = [['bestillinger', `Bestillinger (${orders.length})`], ['annonser', `Mine annonser (${jobs.length})`], ['tilbud', `Tilbud jeg har sendt (${sent.length})`]];
    let body = '';
    if (tab === 'bestillinger') body = orders.length ? orders.map((o) => { const mine = o.role === 'freelancer'; const f = mine ? H.partner('c:' + o.customerId) : H.byId(o.fid); return `<a class="jrow" href="bestilling.html?id=${o.id}">${H.avatar(f, 52)}<div class="grow stack" style="gap:4px"><b style="font-size:16px">${H.esc(o.title)}</b><span class="meta">${mine ? 'Kunde: ' : ''}${H.esc(f.name)} · ${H.esc(o.date)}</span><span class="row" style="gap:6px">${mine ? '<span class="pill acc">Til deg</span>' : ''}${pill(o)}</span></div><span class="budget">${H.kr(o.price)}</span></a>`; }).join('')
      : `<div class="empty">Du har ingen bestillinger ennå.<a class="btn primary sm" href="sok.html">Finn en frilanser</a></div>`;
    if (tab === 'annonser') body = jobs.length ? jobs.map((j) => H.jobRow(Object.assign({ mine: true, posted: j.postedTxt || 'nå' }, j))).join('')
      : `<div class="empty">Du har ingen annonser. Beskriv jobben, så kommer frilanserne til deg.<a class="btn primary sm" href="ny-annonse.html">Legg ut oppdrag</a></div>`;
    if (tab === 'tilbud') body = sent.length ? sent.map((x) => `<a class="jrow" href="annonse.html?id=${x.job.id}"><span class="ico">${H.icon(H.cat(x.job.cat).icon, 24)}</span><div class="grow stack" style="gap:4px"><b>${H.esc(x.job.title)}</b><span class="meta">${H.esc(x.job.area)} · ${H.esc(x.job.date)}</span><span class="pill acc" style="align-self:flex-start">Venter på svar fra kunden</span></div><span class="budget">${H.kr(x.price)}</span></a>`).join('')
      : `<div class="empty">Du har ikke sendt noen tilbud.${S.profile ? '<a class="btn primary sm" href="oppdrag.html">Se ledige oppdrag</a>' : '<span>Lag en frilanserprofil for å sende tilbud på oppdrag.</span><a class="btn primary sm" href="bli-frilanser.html">Bli frilanser</a>'}</div>`;
    document.getElementById('main').innerHTML = `<div class="wrap section" style="max-width:1200px">
      <div class="section-head"><h1>Mine oppdrag</h1><a class="btn primary sm" href="ny-annonse.html">${H.icon('plus', 18, 2.2)} Ny annonse</a></div>
      <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${tab === k}" data-a="tab" data-v="${k}">${t}</button>`).join('')}</div>
      <div class="stack list">${body}</div></div>`;
  }
  H.actions.tab = (v) => { tab = v; history.replaceState(null, '', '?fane=' + v); render(); };
  H.boot(render);
  setInterval(async () => { if (window.Cloud && Cloud.on) await H.refresh(); render(); H.mountHeader(); }, window.Cloud && Cloud.on ? 20000 : 5000);
}
</script>
</body>
</html>
