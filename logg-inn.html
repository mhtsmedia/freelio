<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logg inn | Freelio</title>
<meta name="description" content="Logg inn med Vipps eller BankID.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=b792b330">
<link rel="stylesheet" href="css/ny.css?v=9703482c" id="ny-css">
<script src="js/design.js?v=7c71ad27"></script>
</head>
<body data-page="logg-inn">
<div id="site-header"></div>
<main id="main"><div class="wrap" style="max-width:460px"><div class="section" id="box"></div></div></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=0d9f4ef0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=b3e9a21c"></script>
<script src="js/cloud.js?v=f71f3fd1"></script>
<script type="text/freelio">
const next = H.qs('neste') || 'index.html';
const safeNext = /^[a-z0-9-]+\.html(\?[^#]*)?$/i.test(next) ? next : 'index.html';
let busy = null, step = 'start', name = '';
function render() {
  const box = document.getElementById('box');
  if (window.Cloud && Cloud.on) return renderCloud(box);
  if (H.S.user && step === 'start') { box.innerHTML = `<h1>Du er logget inn</h1><p class="muted">Som ${H.esc(H.S.user.name)}, verifisert med ${H.esc(H.S.user.method)}.</p><a class="btn primary" href="${safeNext}">Fortsett</a><a class="btn soft" href="min-side.html">Min side</a>`; return; }
  if (step === 'name') {
    box.innerHTML = `<h1>Velkommen!</h1><p class="muted">Navnet ditt er bekreftet med ${H.esc(busy)}. Hvilket navn vil du vise til frilanserne?</p>
      <form class="stack" id="nform"><label class="field"><span class="label">Visningsnavn</span><input class="inp" id="name" value="${H.esc(name)}" autocomplete="name"></label>
      <label class="check"><input type="checkbox" id="terms"> <span>Jeg godtar <a href="vilkar.html" target="_blank">brukervilkårene</a> og har lest <a href="personvern.html" target="_blank">personvernerklæringen</a>.</span></label>
      <span class="err-text" id="err"></span><button class="btn primary" type="submit">Opprett konto</button></form>`;
    document.getElementById('nform').addEventListener('submit', (e) => {
      e.preventDefault();
      const n = document.getElementById('name').value.trim();
      if (!n) { document.getElementById('err').textContent = 'Skriv inn et navn.'; return; }
      if (!document.getElementById('terms').checked) { document.getElementById('err').textContent = 'Du må godta vilkårene for å fortsette.'; return; }
      H.S.user = { name: n, method: busy, since: H.today() }; H.save();
      H.flash(`Logget inn som ${n}.`); location.href = safeNext;
    });
    return;
  }
  box.innerHTML = `<h1>Logg inn</h1><p class="muted">Vi bruker Vipps eller BankID, så alle på Freelio har bekreftet hvem de er. Ingen passord å huske.</p>
    <button class="btn dark" data-a="login" data-v="Vipps" ${busy ? 'disabled' : ''}>${busy === 'Vipps' ? 'Venter på godkjenning i Vipps …' : 'Fortsett med Vipps'}</button>
    <button class="btn ghost" data-a="login" data-v="BankID" ${busy ? 'disabled' : ''}>${busy === 'BankID' ? 'Bekrefter med BankID …' : 'Fortsett med BankID'}</button>
    <div class="banner acc">${H.icon('shield', 20)}<span>Vi får bare navnet ditt og at du er over 18 år. Personnummeret ditt lagres ikke hos oss.</span></div>
    <p class="hint">Demo: ingen ekte innlogging. Trykk på en knapp for å fortsette.</p>`;
}
H.actions.login = (v) => { busy = v; render(); setTimeout(() => { name = 'Kari Nordmann'; step = 'name'; render(); }, 1300); };
// Innlogging mot Supabase med e-post og passord
let mode = H.qs('ny') ? 'up' : 'in', cbusy = false, cmsg = '', cerr = '';
function renderCloud(box) {
  if (H.S.user && !cmsg) { box.innerHTML = `<h1>Du er logget inn</h1><p class="muted">Som ${H.esc(H.S.user.name)} (${H.esc(H.S.user.email || '')}).</p><a class="btn primary" href="${safeNext}">Fortsett</a><a class="btn soft" href="min-side.html">Min side</a>`; return; }
  if (cmsg) { box.innerHTML = `<h1>Sjekk e-posten din</h1><p class="muted">${H.esc(cmsg)}</p><button class="btn soft" data-a="mode" data-v="in">Til innlogging</button>`; return; }
  const up = mode === 'up';
  box.innerHTML = `<h1>${up ? 'Opprett konto' : 'Logg inn'}</h1>
    <div class="seg" style="align-self:flex-start"><button aria-pressed="${!up}" data-a="mode" data-v="in">Logg inn</button><button aria-pressed="${up}" data-a="mode" data-v="up">Ny konto</button></div>
    <form class="stack" id="aform" novalidate>
      ${up ? '<label class="field"><span class="label">Navn</span><input class="inp" id="aname" autocomplete="name" required></label>' : ''}
      <label class="field"><span class="label">E-post</span><input class="inp" id="aemail" type="email" autocomplete="email" required></label>
      <label class="field"><span class="label">Passord</span><input class="inp" id="apass" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" minlength="6" required>${up ? '<span class="hint">Minst 6 tegn.</span>' : ''}</label>
      ${up ? `<label class="check"><input type="checkbox" id="aterms"> <span>Jeg godtar <a href="vilkar.html" target="_blank">brukervilkårene</a> og har lest <a href="personvern.html" target="_blank">personvernerklæringen</a>.</span></label>` : ''}
      <span class="err-text" id="aerr" role="alert">${H.esc(cerr)}</span>
      <button class="btn primary" type="submit" ${cbusy ? 'disabled' : ''}>${cbusy ? 'Vent litt …' : up ? 'Opprett konto' : 'Logg inn'}</button>
    </form>
    <p class="hint">Innlogging med Vipps og BankID kommer senere.</p>`;
  document.getElementById('aform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const val = (id) => (document.getElementById(id) || {}).value || '';
    const vals = { aname: val('aname'), aemail: val('aemail'), apass: val('apass') };
    const v = (id) => vals[id];
    const err = (t) => { cerr = t; document.getElementById('aerr').textContent = t; };
    if (up && !v('aname').trim()) return err('Skriv inn navnet ditt.');
    if (!/^\S+@\S+\.\S+$/.test(v('aemail').trim())) return err('Skriv inn en gyldig e-postadresse.');
    if (v('apass').length < 6) return err('Passordet må ha minst 6 tegn.');
    if (up && !document.getElementById('aterms').checked) return err('Du må godta vilkårene for å opprette konto.');
    cbusy = true; cerr = ''; render();
    try {
      if (up) {
        const loggedIn = await Cloud.signUp(v('aname').trim(), v('aemail').trim(), v('apass'));
        if (!loggedIn) { cbusy = false; cmsg = `Vi har sendt en lenke til ${v('aemail').trim()}. Trykk på den for å bekrefte kontoen, så kan du logge inn.`; render(); return; }
      } else await Cloud.signIn(v('aemail').trim(), v('apass'));
      await Cloud.pull();
      H.flash(`Logget inn som ${H.S.user.name}.`);
      location.href = safeNext;
    } catch (ex) { cbusy = false; cerr = Cloud.authError(ex); render(); }
  });
}
H.actions.mode = (v) => { mode = v; cerr = ''; cmsg = ''; render(); };
H.boot(render);
</script>
</body>
</html>
