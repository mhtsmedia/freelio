<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utforsk | Freelio</title>
<meta name="description" content="Bla gjennom arbeid fra lokale frilansere.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="utforsk">
<div id="site-header"></div>
<main id="main">
  <div class="wrap">
    <div class="feed" style="padding-bottom:0"><h1>Utforsk</h1><p class="muted">Nytt arbeid som frilansere har delt. Trykk på et innlegg for å se hele profilen.</p><div class="chips scroll" id="chips" role="group" aria-label="Fagfelt"></div><div class="stack" id="compose" style="gap:12px"></div></div>
    <div class="feed" id="feed" data-skel="feed:2"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/logo.js"></script>
<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/cloud.js"></script>
<script type="text/freelio">
let cat = 'alle';
let draft = null, busy = '', caption = '';
const ago = (t) => { const m = Math.max(1, Math.round((Date.now() - t) / 60000)); return m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' t' : Math.round(m / 1440) + ' d'; };
function composer() {
  const S = H.S;
  if (!S.user) return '';
  if (!S.profile) return `<div class="card row small" style="justify-content:space-between"><span class="muted">Bare frilansere kan legge ut innlegg her.</span><a class="btn soft sm" href="bli-frilanser.html">Bli frilanser</a></div>`;
  if (!draft) return `<div class="card row" style="gap:12px">${H.avatar(S.profile, 40)}<span class="grow muted">Del noe du har laget nylig</span><label class="btn primary sm" for="postFile">${H.icon('plus', 16, 2.2)} Nytt innlegg</label><input type="file" id="postFile" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" class="sr"></div><span class="hint" id="postStatus" style="margin-top:-10px">${H.esc(busy)}</span>`;
  return `<div class="card stack" style="gap:12px"><b>Nytt innlegg</b>
    <div class="post-media" style="max-width:320px">${draft.type === 'video' ? `<video src="${draft.preview}" muted playsinline controls></video>` : `<img src="${draft.preview}" alt="Forhåndsvisning">`}</div>
    <label class="field"><span class="label">Tekst</span><textarea class="inp" id="postCap" rows="3" maxlength="600" placeholder="Fortell kort om jobben, for eksempel sted, kunde eller utstyr.">${H.esc(caption)}</textarea></label>
    <div class="row"><button class="btn primary" data-a="publish" ${busy ? 'disabled' : ''}>${busy ? H.esc(busy) : 'Publiser'}</button><button class="btn soft" data-a="cancelPost" ${busy ? 'disabled' : ''}>Avbryt</button></div></div>`;
}
function render() {
  document.getElementById('chips').innerHTML = [{ id: 'alle', name: 'For deg' }].concat(HDATA.CATS).map((c) => `<button class="chip" data-a="cat" data-v="${c.id}" aria-pressed="${cat === c.id}">${c.name}</button>`).join('');
  document.getElementById('compose').innerHTML = composer();
  const fIn = document.getElementById('postFile'); if (fIn) fIn.addEventListener('change', () => pick(fIn));
  const cap = document.getElementById('postCap'); if (cap) cap.addEventListener('input', () => (caption = cap.value));
  const posts = (H.S.posts || []).map((p) => ({ p, f: H.byId(p.fid) })).filter((x) => x.f && H.inCat(x.f, cat)).sort((a, b) => b.p.at - a.p.at);
  const mineId = H.S.profile && H.S.profile.id;
  document.getElementById('feed').innerHTML = posts.length ? posts.map(({ p, f }) => {
    const key = 'p:' + p.id; const liked = H.S.liked.includes(key); const saved = H.S.saved.includes(f.id);
    return `<article class="post">
      <div class="row" style="flex-wrap:nowrap;gap:8px"><a class="post-h grow" href="frilanser.html?id=${f.id}">${H.avatar(f, 42)}<span class="grow stack" style="gap:0"><b>${H.esc(f.name)} ${H.verified(f)}</b><span class="meta">${H.esc(f.role)} · ${H.esc(f.area)} · ${ago(p.at)}</span></span></a>${p.fid === mineId ? `<button class="btn link small" data-a="delPost" data-v="${p.id}">Slett</button>` : `<span class="rate">${H.star()} ${H.ratingTxt(f)}</span>`}</div>
      <div class="post-media">${p.type === 'video' ? `<video src="${H.esc(p.url)}" poster="${H.esc(p.thumb)}" controls playsinline preload="none"></video>` : `<a href="frilanser.html?id=${f.id}" aria-label="Se profilen til ${H.esc(f.name)}"><img src="${H.esc(p.url)}" alt="${H.esc(p.cap || 'Arbeid fra ' + f.name)}" loading="lazy"></a>`}</div>
      <div class="row" style="gap:2px">
        <button class="ibtn plain" data-a="like" data-v="${key}" aria-pressed="${liked}" aria-label="Lik" style="color:${liked ? 'var(--like)' : 'inherit'}">${H.icon('heart', 24, 1.8, liked ? 'currentColor' : 'none')}</button>
        <button class="ibtn plain" data-a="save" data-v="${f.id}" aria-pressed="${saved}" aria-label="Lagre ${H.esc(f.name)}">${H.icon('save', 22, 1.8, saved ? 'currentColor' : 'none')}</button>
        <a class="ibtn plain" href="meldinger.html?med=${f.id}" aria-label="Send melding til ${H.esc(f.name)}">${H.icon('chat', 22)}</a>
        <span class="grow meta" style="padding-left:8px">${H.priceTxt(f)}</span>
        <a class="btn dark sm" href="book.html?id=${f.id}">Book</a>
      </div>
      ${p.cap ? `<p style="margin:0"><b>${H.esc(f.name)}</b> ${H.esc(p.cap)}</p>` : ''}</article>`;
  }).join('') : `<div class="empty"><b style="color:var(--fg)">Ingen innlegg ${cat === 'alle' ? 'ennå' : 'i denne kategorien ennå'}</b><span>Frilansere legger selv ut arbeid her.</span></div>`;
}
async function pick(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  try {
    if (/^video\//.test(file.type)) {
      const mb = H.VID_MB();
      if (file.size > mb * 1048576) throw new Error(`Videoen er over ${mb} MB. Korte den ned eller eksporter i lavere kvalitet.`);
      busy = 'Leser video …'; render();
      const poster = await H.videoPoster(file);
      draft = { type: 'video', file, poster, preview: URL.createObjectURL(file) };
    } else {
      const blob = await H.cropImage(file, { aspect: 4 / 5, outW: 1080, title: 'Juster innlegget', hint: 'Alle innlegg vises i samme format. Dra bildet for å flytte det, og zoom for å velge utsnittet.' });
      if (!blob) return;
      draft = { type: 'image', blob, preview: URL.createObjectURL(blob) };
    }
  } catch (e) { H.toast(e.message || 'Filen kunne ikke leses'); }
  busy = ''; render();
}
H.actions.cat = (v) => { cat = v; render(); };
H.actions.like = (v) => { const i = H.S.liked.indexOf(v); i > -1 ? H.S.liked.splice(i, 1) : H.S.liked.push(v); H.save(); render(); H.popIn(`[data-a="like"][data-v="${v}"] svg`); };
H.actions.cancelPost = () => { draft = null; caption = ''; render(); };
H.actions.publish = async () => {
  if (!draft || busy) return;
  busy = 'Laster opp …'; render();
  try {
    let post;
    if (draft.type === 'video') {
      const thumb = await H.storeImage('thumb', draft.poster.blob);
      post = { type: 'video', url: await H.storeImage('post', draft.file), thumb, w: draft.poster.w, h: draft.poster.h, cap: caption.trim() };
    } else {
      const small = await H.resizeImage(draft.blob, 540);
      post = { type: 'image', url: await H.storeImage('post', draft.blob), thumb: await H.storeImage('thumb', small.blob), cap: caption.trim() };
    }
    await H.addPost(post);
    draft = null; caption = ''; H.toast('Innlegget er publisert');
  } catch (e) { H.toast(e.message || 'Kunne ikke publisere'); }
  busy = ''; render();
};
H.actions.delPost = async (v) => {
  if (!confirm('Vil du slette innlegget?')) return;
  try { await H.removePost(v); H.toast('Innlegget er slettet'); } catch (e) { H.toast(e.message || 'Kunne ikke slette'); }
  render();
};
H.boot(render);
</script>
</body>
</html>
