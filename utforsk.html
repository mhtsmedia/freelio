<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utforsk | Freelio</title>
<meta name="description" content="Bla gjennom arbeid fra lokale frilansere.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="utforsk">
<div id="site-header"></div>
<main id="main">
  <div class="wrap">
    <div class="feed" style="padding-bottom:0"><h1>Utforsk</h1><p class="muted">Nytt arbeid fra frilansere i nærheten. Trykk på et innlegg for å se hele profilen.</p><div class="chips scroll" id="chips" role="group" aria-label="Fagfelt"></div></div>
    <div class="feed" id="feed" data-skel="feed:2"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/logo.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let cat = 'alle';
const CAPS = { bryllup: ['Detaljer fra vielsen', 'Første dans'], portrett: ['Portrett i studio'], event: ['Taler og stemning'], produkt: ['Nye produkter i studio'], eiendom: ['Kveldslys over fjorden'], drone: ['Dronebilder fra Kalvøya'], reklamefilm: ['Bak kamera'], some: ['Ny reel for kafé'] };
function render() {
  document.getElementById('chips').innerHTML = [{ id: 'alle', name: 'For deg' }].concat(HDATA.CATS).map((c) => `<button class="chip" data-a="cat" data-v="${c.id}" aria-pressed="${cat === c.id}">${c.name}</button>`).join('');
  const fl = H.all().filter((f) => H.inCat(f, cat));
  const posts = [];
  fl.forEach((f, i) => { posts.push({ f, cap: f.cap, pal: f.pal, ago: (i % 5) + 1 + ' t' }); (CAPS[f.cat] || []).slice(0, 1).forEach((c, k) => posts.push({ f, cap: c, pal: f.pal + 3 + k, ago: (i % 3) + 1 + ' d' })); });
  posts.sort((a, b) => (a.f.id + a.cap).length % 7 - (b.f.id + b.cap).length % 7);
  document.getElementById('feed').innerHTML = posts.length ? posts.map((p, n) => {
    const f = p.f; const key = f.id + ':' + n; const liked = H.S.liked.includes(key); const saved = H.S.saved.includes(f.id);
    return `<article class="post">
      <a class="post-h" href="frilanser.html?id=${f.id}">${H.avatar(f, 42)}<span class="grow stack" style="gap:0"><b>${H.esc(f.name)} ${H.verified(f)}</b><span class="meta">${H.esc(f.role)} · ${H.esc(f.area)} · ${p.ago}</span></span><span class="rate">${H.star()} ${H.num(f.rating.toFixed(1))}</span></a>
      <a class="ph" href="frilanser.html?id=${f.id}" style="${H.phStyle(p.pal)}" aria-label="${H.esc(p.cap)}, av ${H.esc(f.name)}"><span class="cap">${H.esc(p.cap)}</span></a>
      <div class="row" style="gap:2px">
        <button class="ibtn plain" data-a="like" data-v="${key}" aria-pressed="${liked}" aria-label="Lik" style="color:${liked ? 'var(--like)' : 'inherit'}">${H.icon('heart', 24, 1.8, liked ? 'currentColor' : 'none')}</button>
        <button class="ibtn plain" data-a="save" data-v="${f.id}" aria-pressed="${saved}" aria-label="Lagre ${H.esc(f.name)}">${H.icon('save', 22, 1.8, saved ? 'currentColor' : 'none')}</button>
        <a class="ibtn plain" href="meldinger.html?med=${f.id}" aria-label="Send melding til ${H.esc(f.name)}">${H.icon('chat', 22)}</a>
        <span class="grow meta" style="padding-left:8px">${H.priceTxt(f)}</span>
        <a class="btn dark sm" href="book.html?id=${f.id}">Book</a>
      </div></article>`;
  }).join('') : `<div class="empty">Ingen innlegg i denne kategorien ennå.</div>`;
}
H.actions.cat = (v) => { cat = v; render(); };
H.actions.like = (v) => { const i = H.S.liked.indexOf(v); i > -1 ? H.S.liked.splice(i, 1) : H.S.liked.push(v); H.save(); render(); H.popIn(`[data-a="like"][data-v="${v}"] svg`); };
H.boot(render);
</script>
</body>
</html>
