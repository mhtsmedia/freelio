<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledige oppdrag | Freelio</title>
<meta name="description" content="Oppdrag lagt ut av kunder i nærheten. Send tilbud som frilanser.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=760da67c">
<link rel="stylesheet" href="css/ny.css?v=620a6d89" id="ny-css">
<script src="js/design.js?v=7c71ad27"></script>
</head>
<body data-page="oppdrag">
<div id="site-header"></div>
<main id="main">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Forside</a><span>/</span><span>Oppdrag</span></div>
    <div class="section-head" style="margin-top:12px"><div class="stack" style="gap:6px"><h1>Ledige oppdrag</h1><p class="muted">Kunder i nærheten har beskrevet jobben og budsjettet. Send tilbud på det som passer deg.</p></div><a class="btn primary" href="ny-annonse.html">Legg ut oppdrag</a></div>
    <div class="with-side">
      <aside class="side" id="side" aria-label="Filtre">
        <fieldset><legend>Fagfelt</legend><div id="fcat" class="stack" style="gap:0"></div></fieldset>
        <fieldset><legend>Avstand</legend><select class="inp" id="dist"><option value="5">Innen 5 km</option><option value="10">Innen 10 km</option><option value="999" selected>Alle</option></select></fieldset>
        <fieldset><legend>Minste budsjett</legend><input class="inp" id="minb" inputmode="numeric" placeholder="kr"></fieldset>
        <div class="card soft stack small" id="who"></div>
      </aside>
      <section>
        <div class="results-head"><b id="count" style="font-size:18px"></b>
          <div class="row"><button class="btn soft sm filters-toggle" type="button" id="ftoggle" aria-expanded="false">Filtre</button>
          <label class="row small" style="gap:6px">Sorter <select class="inp" id="sort" style="height:38px;width:auto;font-size:14px"><option value="new">Nyeste</option><option value="budget">Høyest budsjett</option><option value="near">Nærmest</option><option value="few">Færrest tilbud</option></select></label></div></div>
        <div class="stack list" id="list" data-skel="list:6"></div>
      </section>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=a40d434d"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=e64b764f"></script>
<script src="js/cloud.js?v=a26e07f4"></script>
<script type="text/freelio">
const $ = (id) => document.getElementById(id);
const k0 = H.qs('kat') || 'alle';
$('fcat').innerHTML = [{ id: 'alle', name: 'Alle fagfelt' }].concat(HDATA.CATS).map((c) => `<label class="check"><input type="radio" name="kat" value="${c.id}" ${k0 === c.id ? 'checked' : ''}> ${c.name}</label>`).join('');
function render() {
  const kat = document.querySelector('input[name=kat]:checked').value;
  const dist = +$('dist').value, minb = +$('minb').value.replace(/\D/g, '') || 0;
  let list = H.allJobs().filter((j) => (kat === 'alle' || j.cat === kat) && (j.km || 0) <= dist && j.budget >= minb);
  const s = $('sort').value;
  if (s === 'budget') list.sort((a, b) => b.budget - a.budget);
  if (s === 'near') list.sort((a, b) => (a.km || 0) - (b.km || 0));
  if (s === 'few') list.sort((a, b) => (a.mine ? H.jobOffers(a).length : a.offers) - (b.mine ? H.jobOffers(b).length : b.offers));
  $('count').textContent = list.length + ' oppdrag';
  $('list').innerHTML = list.length ? list.map(H.jobRow).join('') : `<div class="empty">Ingen oppdrag med disse filtrene akkurat nå.</div>`;
  $('who').innerHTML = H.S.profile ? `<b>Du er registrert som frilanser</b><span class="muted">Åpne et oppdrag for å sende tilbud.</span>` : `<b>Vil du sende tilbud?</b><span class="muted">Lag en gratis frilanserprofil først.</span><a class="btn primary sm" href="bli-frilanser.html">Bli frilanser</a>`;
}
$('side').addEventListener('change', render); $('minb').addEventListener('input', render); $('sort').addEventListener('change', render);
$('ftoggle').addEventListener('click', (e) => { const o = $('side').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); });
H.boot(render);
</script>
</body>
</html>
