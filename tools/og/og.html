<!doctype html>
<!-- Delingsbildet (og:image) for Freelio, 1200 x 630. Lag PNG på nytt med: python tools/seo.py --bilde -->
<html lang="nb"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Figtree';font-weight:400 800;src:url(../../css/fonts/figtree-latin.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:400 800;src:url(../../css/fonts/manrope-latin.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Figtree,system-ui,sans-serif;background:#FFFFFF;color:#1A1D21;display:grid;grid-template-columns:1fr 430px}
.l{padding:72px 0 64px 80px;display:flex;flex-direction:column}
.logo{width:250px;height:auto;color:#0A0A0B}
h1{font-family:Manrope,Figtree,sans-serif;font-weight:800;font-size:66px;line-height:1.04;letter-spacing:-.02em;margin-top:58px}
p{font-size:28px;line-height:1.35;color:#4A5058;margin-top:26px;max-width:620px}
.url{margin-top:auto;font-size:22px;font-weight:600;color:#3E5368}
.r{background:#E6ECF1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:14px;padding:44px}
.t{border-radius:18px;background:#3E5368;display:grid;place-items:center;color:#E6ECF1;font-weight:700;font-size:21px}
.t:nth-child(2n){background:#FFFFFF;color:#3E5368}
.t:nth-child(3){background:#1A1D21;color:#fff}
.t svg{width:46px;height:46px;display:block;margin:0 auto 8px}
</style></head>
<body>
<div class="l">
  <img class="logo" src="../../img/wordmark.svg" alt="Freelio">
  <h1>Finn fotograf, videograf og dronepilot</h1>
  <p>Se arbeidet, sammenlign og book lokalt. Pengene utbetales først når jobben er levert.</p>
  <span class="url">mhtsmedia.github.io/freelio</span>
</div>
<div class="r" aria-hidden="true">
  <div class="t"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</span></div>
  <div class="t"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>Video</span></div>
  <div class="t"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7 7l3 3m7-3-3 3m-7 7 3-3m7 3-3-3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>Drone</span></div>
  <div class="t"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Trygg betaling</span></div>
  <div class="t"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Lokalt</span></div>
  <div class="t"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>Ekte omtaler</span></div>
</div>
</body></html>
