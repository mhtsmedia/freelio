<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sammenlign | Freelio</title>
<meta name="description" content="Sammenlign opptil tre frilansere side om side.">
<script>try{var t=localStorage.getItem("freelio:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=760da67c">
<link rel="stylesheet" href="css/ny.css?v=620a6d89" id="ny-css">
<script src="js/design.js?v=7c71ad27"></script>
</head>
<body data-page="sammenlign">
<div id="site-header"></div>
<main id="main" data-skel="page"></main>
<div id="site-footer"></div>
<script src="js/logo.js?v=e81a0a03"></script>
<script src="js/data.js?v=13ca9b41"></script>
<script src="js/config.js?v=a40d434d"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="js/app.js?v=e64b764f"></script>
<script src="js/cloud.js?v=a26e07f4"></script>
<script type="text/freelio">
function render() {
  const list = H.S.cmp.map(H.byId).filter(Boolean);
  const main = document.getElementById('main');
  if (list.length < 2) {
    main.innerHTML = `<div class="wrap section" style="max-width:1200px"><h1>Sammenlign</h1><div class="empty"><b style="color:var(--fg)">Velg minst to frilansere</b><span>Trykk «Sammenlign» på kortene i søket. Du kan velge opptil tre.</span>${list.length ? `<span>Valgt nå: ${H.esc(list[0].name)}</span>` : ''}<a class="btn primary sm" href="sok.html">Gå til søk</a></div></div>`;
    return;
  }
  const rows = [
    ['Vurdering', (f) => f.rating, 'max', (f) => H.ratingTxt(f)],
    ['Antall omtaler', (f) => f.reviews, 'max', (f) => f.reviews],
    ['Fullførte oppdrag', (f) => f.jobs, 'max', (f) => f.jobs],
    ['Startpris', (f) => f.from, 'min', (f) => H.kr(f.from) + (f.unit || '')],
    ['Svartid', (f) => f.respH, 'min', (f) => f.resp],
    ['Leveringstid', (f) => f.delD || 0.5, 'min', (f) => (f.delD ? f.delD + ' dager' : 'Samme dag')],
    ['Avstand', (f) => f.km, 'min', (f) => f.km + ' km'],
    ['Erfaring', (f) => f.years, 'max', (f) => f.years + ' år'],
    ['Ledig kapasitet', (f) => (f.free ? 1 : 0), 'max', (f) => (f.free ? 'Ja' : 'Begrenset')],
    ['BankID-verifisert', (f) => (f.verified ? 1 : 0), 'max', (f) => (f.verified ? 'Ja' : 'Nei')]
  ];
  main.innerHTML = `<div class="wrap section">
    <div class="section-head"><div class="stack" style="gap:6px"><h1>Sammenlign</h1><p class="muted">Uthevet felt viser beste verdi i hver rad.</p></div><a href="sok.html">Legg til flere</a></div>
    <div class="scroll-x"><table class="cmp-table">
      <thead><tr><td></td>${list.map((f) => `<th scope="col"><div class="stack" style="align-items:center;gap:6px">${H.avatar(f, 56)}<a href="frilanser.html?id=${f.id}" style="color:var(--fg)">${H.esc(f.name)}</a><span class="meta" style="font-weight:600">${H.esc(f.role)}</span><button class="btn link small" data-a="cmp" data-v="${f.id}">Fjern</button></div></th>`).join('')}</tr></thead>
      <tbody>${rows.map(([k, get, how, show]) => { const vals = list.map(get); const best = how === 'max' ? Math.max(...vals) : Math.min(...vals); const allSame = vals.every((v) => v === vals[0]); return `<tr><th scope="row">${k}</th>${list.map((f, i) => `<td class="${vals[i] === best && !allSame ? 'best' : ''}">${show(f)}</td>`).join('')}</tr>`; }).join('')}
      <tr><th scope="row">Pakker</th>${list.map((f) => `<td class="small" style="text-align:left">${f.pk.map((p) => `${H.esc(p[0])}: <b>${H.kr(p[1])}</b>`).join('<br>')}</td>`).join('')}</tr>
      <tr><th scope="row">Kundene sier</th>${list.map((f) => `<td class="small muted" style="text-align:left">${H.esc(f.sum)}</td>`).join('')}</tr>
      <tr><td></td>${list.map((f) => `<td><div class="stack" style="gap:6px"><a class="btn primary sm" href="book.html?id=${f.id}">Book</a><a class="btn soft sm" href="meldinger.html?med=${f.id}">Send melding</a></div></td>`).join('')}</tr></tbody>
    </table></div>
    <a class="banner acc" href="assistent.html?q=${encodeURIComponent('Hva bør jeg se etter i en fotograf?')}" style="text-decoration:none">${H.icon('spark', 20)}<span>Usikker på hva som betyr mest? Spør assistenten hva du bør se etter.</span></a>
  </div>`;
}
H.boot(render);
</script>
</body>
</html>
